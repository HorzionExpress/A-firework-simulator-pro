<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎆 烟花模拟器 · 专业版</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #04050b;
    color: #e8ecff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  #app {
    display: flex;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ==================== 舞台 ==================== */
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #000;
  }

  #cv {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  .hud {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    pointer-events: none;
    z-index: 5;
    max-width: calc(100% - 28px);
  }

  .hud-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 13px;
    border-radius: 999px;
    background: rgba(9, 13, 30, 0.62);
    border: 1px solid rgba(96, 126, 226, 0.30);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-size: 12.5px;
    color: #b9c5f7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    width: fit-content;
  }

  .hud-chip.accent {
    color: #ffd166;
    border-color: rgba(255, 209, 102, 0.32);
  }

  .hud-chip.money {
    color: #7cf5a0;
    border-color: rgba(124, 245, 160, 0.32);
    font-weight: 700;
  }

  .hud-chip.money.negative {
    color: #ff8fa8;
    border-color: rgba(255, 143, 168, 0.4);
  }

  .hint-bar {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    padding: 5px 16px;
    border-radius: 999px;
    background: rgba(8, 11, 26, 0.55);
    border: 1px solid rgba(80, 105, 190, 0.2);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 11.5px;
    color: rgba(180, 195, 255, 0.6);
    pointer-events: none;
    white-space: nowrap;
    z-index: 5;
  }

  .pause-mask {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3, 5, 14, 0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
    z-index: 8;
    pointer-events: none;
  }

  .pause-mask.show {
    opacity: 1;
    visibility: visible;
  }

  .pause-mask span {
    font-size: 22px;
    letter-spacing: 6px;
    color: #9fb0f0;
    padding: 14px 30px;
    border-radius: 16px;
    border: 1px solid rgba(120, 150, 255, 0.3);
    background: rgba(12, 16, 36, 0.7);
  }

  /* ==================== Toast ==================== */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    padding: 20px 44px;
    background: linear-gradient(180deg, rgba(35, 20, 15, 0.96), rgba(20, 12, 25, 0.96));
    border: 1px solid rgba(255, 200, 100, 0.45);
    border-radius: 16px;
    color: #ffe0a0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s, transform 0.35s;
    z-index: 100;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.75);
    text-align: center;
    max-width: 84vw;
    line-height: 1.5;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast::before {
    content: "⚠";
    display: block;
    font-size: 26px;
    color: #ffb347;
    margin-bottom: 8px;
  }

  .toast.good {
    background: linear-gradient(180deg, rgba(15, 35, 25, 0.96), rgba(12, 25, 20, 0.96));
    border-color: rgba(100, 255, 180, 0.45);
    color: #a8ffd8;
  }

  .toast.good::before {
    content: "✓";
    color: #5fd8b0;
  }

  /* ==================== 确认对话框 ==================== */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3, 5, 14, 0.72);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
    z-index: 200;
  }

  .confirm-overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .confirm-box {
    background: linear-gradient(180deg, #14182e, #0c1024);
    border: 1px solid rgba(255, 180, 80, 0.42);
    border-radius: 18px;
    padding: 26px 30px 22px;
    max-width: 440px;
    width: 88vw;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    transform: scale(0.92);
    transition: transform 0.3s;
  }

  .confirm-overlay.show .confirm-box {
    transform: scale(1);
  }

  .confirm-icon {
    font-size: 38px;
    margin-bottom: 8px;
  }

  .confirm-title {
    font-size: 18px;
    font-weight: 800;
    color: #ffe0a0;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .confirm-msg {
    font-size: 14px;
    line-height: 1.65;
    color: #b8c4f5;
    margin-bottom: 22px;
    white-space: pre-line;
  }

  .confirm-btns {
    display: flex;
    gap: 10px;
  }

  .confirm-btn {
    flex: 1;
    padding: 11px 16px;
    border-radius: 10px;
    border: 1px solid;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, transform 0.1s;
  }

  .confirm-btn:active {
    transform: scale(0.97);
  }

  .confirm-btn.cancel {
    background: #161c38;
    border-color: #2a3358;
    color: #dfe5ff;
  }

  .confirm-btn.cancel:hover {
    background: #1e2648;
    border-color: #3d4a80;
  }

  .confirm-btn.ok {
    background: linear-gradient(180deg, #6a2a1a, #401810);
    border-color: #a04828;
    color: #ffd9a8;
  }

  .confirm-btn.ok:hover {
    background: linear-gradient(180deg, #8a3a24, #501e14);
    border-color: #c85a30;
  }

  .confirm-btn.ok.good {
    background: linear-gradient(180deg, #1a5a3a, #103828);
    border-color: #28a068;
    color: #b8ffe0;
  }

  .confirm-btn.ok.good:hover {
    background: linear-gradient(180deg, #207048, #144030);
    border-color: #38c880;
  }

  /* ==================== 里程碑弹窗 ==================== */
  .milestone-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3, 5, 14, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s, visibility 0.3s;
    z-index: 250;
  }

  .milestone-overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .milestone-box {
    background: linear-gradient(180deg, #2a1a08, #180e05);
    border: 2px solid #ffd166;
    border-radius: 20px;
    padding: 34px 40px 28px;
    max-width: 380px;
    width: 86vw;
    text-align: center;
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.8),
                0 0 120px rgba(255, 200, 80, 0.22);
    transform: scale(0.85);
    transition: transform 0.4s;
  }

  .milestone-overlay.show .milestone-box {
    transform: scale(1);
  }

  .milestone-icon {
    font-size: 62px;
    margin-bottom: 12px;
  }

  .milestone-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #ffb347;
    margin-bottom: 8px;
  }

  .milestone-name {
    font-size: 26px;
    font-weight: 900;
    color: #ffe0a0;
    letter-spacing: 3px;
    margin-bottom: 14px;
    text-shadow: 0 0 30px rgba(255, 200, 80, 0.6);
  }

  .milestone-amount {
    font-size: 15px;
    color: #c8b890;
    margin-bottom: 6px;
  }

  .milestone-amount b {
    color: #ffd166;
    font-weight: 800;
    font-size: 18px;
  }

  .milestone-reward {
    font-size: 13px;
    color: #7cf5a0;
    margin-bottom: 20px;
  }

  .milestone-close {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 200, 80, 0.5);
    background: linear-gradient(180deg, rgba(80, 50, 15, 0.9), rgba(45, 28, 8, 0.9));
    color: #ffd166;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
  }

  .milestone-close:hover {
    background: linear-gradient(180deg, rgba(100, 65, 20, 0.95), rgba(55, 35, 10, 0.95));
  }

  /* ==================== 新手引导 ==================== */
  .guide-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: none;
  }

  .guide-overlay.show {
    display: block;
  }

  .guide-spot {
    position: fixed;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    border-radius: 14px;
    pointer-events: none;
    box-shadow:
      0 0 0 9999px rgba(2, 4, 12, 0.82),
      0 0 0 2px rgba(255, 209, 102, 0.88),
      0 0 30px 6px rgba(255, 200, 80, 0.24);
  }

  .guide-tip {
    position: fixed;
    left: 0;
    top: 0;
    width: 360px;
    max-width: calc(100vw - 28px);
    padding: 14px 16px 13px;
    border-radius: 16px;
    background: linear-gradient(180deg, #182046, #0b1024);
    border: 1px solid rgba(255, 209, 102, 0.45);
    box-shadow: 0 18px 54px rgba(0, 0, 0, 0.78),
                0 0 0 1px rgba(90, 123, 240, 0.16);
    color: #e6ebff;
    font-family: inherit;
    z-index: 2;
  }

  .guide-tip-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .guide-step-icon {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    border-radius: 10px;
    background: linear-gradient(145deg, #2b3a7a, #1a2148);
    border: 1px solid rgba(120, 150, 255, 0.35);
  }

  .guide-step-text {
    flex: 1 1 auto;
    min-width: 0;
  }

  .guide-step-label {
    font-size: 10px;
    letter-spacing: 1.4px;
    color: #7f8ac4;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .guide-step-title {
    font-size: 15.5px;
    font-weight: 800;
    color: #ffe0a0;
    letter-spacing: 0.5px;
    line-height: 1.3;
  }

  .guide-close {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 1px solid #2a3358;
    background: #161c38;
    color: #9aa4d8;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .guide-close:hover {
    background: #1e2648;
    border-color: #3d4a80;
    color: #ffffff;
  }

  .guide-text {
    font-size: 13px;
    line-height: 1.78;
    color: #c6d0f5;
  }

  .guide-text b {
    color: #ffd166;
    font-weight: 700;
  }

  .guide-note {
    margin-top: 10px;
    padding: 9px 11px;
    border-radius: 10px;
    background: rgba(60, 200, 120, 0.10);
    border: 1px solid rgba(90, 220, 140, 0.32);
    color: #a8ffd8;
    font-size: 12px;
    line-height: 1.72;
  }

  .guide-note b {
    color: #dcffec;
    font-weight: 700;
  }

  .guide-dots {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 12px 0 10px;
  }

  .guide-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: #2a3358;
    transition: width 0.2s, background 0.2s;
  }

  .guide-dot.active {
    width: 18px;
    background: linear-gradient(90deg, #ffd166, #ff9f43);
  }

  .guide-actions {
    display: flex;
    gap: 7px;
  }

  .guide-btn {
    flex: 1;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid #2a3358;
    background: #161c38;
    color: #dfe5ff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s, opacity 0.15s;
  }

  .guide-btn:hover {
    background: #1e2648;
    border-color: #3d4a80;
  }

  .guide-btn:active {
    transform: scale(0.98);
  }

  .guide-btn.ghost {
    flex: 0 0 auto;
    min-width: 64px;
    background: transparent;
    border-color: #232a4d;
    color: #8f99cc;
  }

  .guide-btn.ghost:hover {
    background: #141a34;
    color: #c3ccf5;
  }

  .guide-btn.primary {
    background: linear-gradient(180deg, #d09b2a, #a8731a);
    border-color: #ffd166;
    color: #23180a;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  .guide-btn.primary:hover {
    background: linear-gradient(180deg, #e8b03a, #bd8420);
  }

  .guide-btn.disabled,
  .guide-btn:disabled {
    opacity: 0.32;
    cursor: not-allowed;
    transform: none;
  }

  .guide-btn.disabled:hover,
  .guide-btn:disabled:hover {
    background: #161c38;
    border-color: #2a3358;
  }

  /* ==================== 控制台 ==================== */
  #panel {
    flex: 0 0 396px;
    width: 396px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #0b1022 0%, #070a15 100%);
    border-left: 1px solid #1b2142;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px 14px 60px;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: #262e55 transparent;
  }

  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel::-webkit-scrollbar-thumb { background: #262e55; border-radius: 4px; }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 2px 2px 0;
  }

  .brand h1 {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 1.2px;
    background: linear-gradient(90deg, #ffd166, #ff8a5c, #7c9bff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand small {
    font-size: 10.5px;
    color: #5c6599;
  }

  .card {
    background: #0e1226;
    border: 1px solid #1a2140;
    border-radius: 14px;
    padding: 12px;
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.8px;
    color: #7f8ac4;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .card-title::before {
    content: "";
    display: block;
    width: 3px;
    height: 12px;
    border-radius: 2px;
    background: linear-gradient(180deg, #5d7bf5, #9a6bff);
  }

  /* 模式切换 */
  .mode-switch {
    display: flex;
    gap: 6px;
    padding: 4px;
    background: #0a0e1f;
    border: 1px solid #1a2140;
    border-radius: 12px;
  }

  .mode-btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: transparent;
    color: #7f8ac4;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .mode-btn:hover {
    background: #131938;
    color: #b8c4f5;
  }

  .mode-btn.active {
    background: linear-gradient(180deg, #2b3a7a, #1d2554);
    border-color: #4b6bd6;
    color: #ffffff;
    box-shadow: 0 0 16px rgba(80, 120, 255, 0.35);
  }

  .mode-btn.active[data-mode="business"] {
    background: linear-gradient(180deg, #2a6a3a, #1a4524);
    border-color: #3da85a;
    box-shadow: 0 0 16px rgba(60, 200, 100, 0.35);
  }

  /* 经营卡片 */
  .business-card {
    display: none;
    border-color: rgba(60, 200, 100, 0.28);
    background: linear-gradient(180deg, #0c1a14, #0a1310);
  }

  .business-card.show {
    display: block;
  }

  .business-balance {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .business-balance-label {
    font-size: 11px;
    color: #7f8ac4;
    letter-spacing: 1px;
  }

  .business-balance-num {
    font-size: 30px;
    font-weight: 900;
    color: #7cf5a0;
    text-shadow: 0 0 24px rgba(124, 245, 160, 0.4);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .business-balance-num.negative {
    color: #ff8fa8;
  }

  .business-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 12px;
  }

  .biz-stat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 9px;
    background: rgba(10, 20, 15, 0.6);
    border: 1px solid rgba(40, 90, 60, 0.35);
    border-radius: 8px;
    font-size: 11px;
  }

  .biz-stat span {
    color: #6fa88a;
  }

  .biz-stat b {
    color: #b8e8cc;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .biz-stat b.positive { color: #7cf5a0; }
  .biz-stat b.negative { color: #ff8fa8; }

  /* 里程碑进度 */
  .milestone-panel {
    padding: 10px 11px;
    background: rgba(15, 25, 20, 0.65);
    border: 1px solid rgba(255, 200, 80, 0.2);
    border-radius: 10px;
    margin-bottom: 12px;
  }

  .milestone-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .milestone-header-icon {
    font-size: 16px;
  }

  .milestone-header-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .milestone-header-title {
    font-size: 10.5px;
    color: #b8963a;
    letter-spacing: 1.4px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .milestone-header-name {
    font-size: 12.5px;
    color: #ffe0a0;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .milestone-pct {
    font-size: 13px;
    color: #ffd166;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .milestone-bar {
    position: relative;
    height: 8px;
    background: rgba(30, 20, 10, 0.85);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .milestone-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: linear-gradient(90deg, #ff8c42, #ffd166, #ffe0a0);
    border-radius: 999px;
    box-shadow: 0 0 12px rgba(255, 200, 80, 0.55);
    transition: width 0.6s;
  }

  .milestone-next {
    font-size: 10px;
    color: #a8a890;
    font-variant-numeric: tabular-nums;
  }

  /* 图表 */
  .chart-wrap {
    margin-bottom: 12px;
    background: rgba(10, 20, 15, 0.55);
    border: 1px solid rgba(40, 90, 60, 0.3);
    border-radius: 10px;
    padding: 8px 8px 6px;
  }

  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

  /* 按钮 */

  .btn {

  .btn.good:hover {

  }

  .btn.help {

    color: #d9ccff;
    background: #1a1630;
  }

  .btn.help:hover {

  .settings-grid {

  .settings-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1px solid #2a3358;
    background: #161c38;
    color: #dfe5ff;
    font-family: inherit;

    font-weight: 600;

    transition: background 0.18s, border-color 0.18s, transform 0.1s;

  .settings-btn:hover { background: #1e2648; border-color: #3d4a80; }
  .settings-btn:active { transform: scale(0.97); }

  .settings-btn.off {
    border-color: #4a2738;
    color: #a8b0c8;
    background: #181628;
  }

  .settings-icon { font-size: 18px; line-height: 1; }

  .settings-label {
    font-size: 10px;
    color: #7f8ac4;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .settings-value {
    font-size: 12px;
    font-weight: 700;
    color: #7cf5a0;
  }

  .settings-btn.off .settings-value {
    color: #8a90a8;
  }

  /* 账单 */
  .total-box {

  .total-num {

  .bill {

  .bill::-webkit-scrollbar { width: 6px; }
  .bill::-webkit-scrollbar-thumb {
    background: #262e55;
    border-radius: 3px;
  }

  .bill-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 2px;
    font-size: 12px;
    border-bottom: 1px dashed #1a2142;
  }

  .bill-row:last-child { border-bottom: none; }

  .bill-name {
    color: #a8b2e0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bill-name b {
    color: #6d78b0;
    font-weight: 500;
    font-size: 11px;
  }

  .bill-cost {
    color: #ffcf6b;
    font-weight: 700;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .bill-empty {

  /* ==================== 响应式 ==================== */
  @media (max-width: 1024px) {

  @media (max-width: 820px) {

    .bill { max-height: 160px; }
    .business-balance-num { font-size: 24px; }
    #bizChart { height: 70px; }

    .guide-tip {
      width: 320px;
      padding: 12px 14px 11px;
    }
    .guide-step-title { font-size: 14.5px; }
    .guide-text { font-size: 12.5px; }
    .guide-note { font-size: 11.5px; }
  }

  @media (max-width: 480px) {
    .brand h1 { font-size: 15px; }
    .mode-btn { font-size: 12px; padding: 9px 4px; }
    .scene-btn { font-size: 10.5px; padding: 7px 2px; }

  @media (max-height: 460px) and (orientation: landscape) {
    #app { flex-direction: row; }
    #stage { min-height: 0; }
    #panel {
      flex: 0 0 310px;

      border-top: none;

</style>
</head>
<body>

<div id="app">

  <div id="stage">
    <canvas id="cv"></canvas>

    <div class="hud">
      <div class="hud-chip" id="hudScene">🌃 城市夜景</div>
      <div class="hud-chip accent" id="hudSel">当前：✨ 仙女棒 ¥2/根</div>
      <div class="hud-chip money" id="hudMoney" style="display:none;">💰 ¥10,000</div>
    </div>

    <div class="hint-bar" id="hintBar">点击画面燃放 · 空格键暂停</div>

    <div class="pause-mask" id="pauseMask"><span>已 暂 停</span></div>
  </div>

  <aside id="panel">

    <div class="brand">
      <h1>🎆 烟花模拟器</h1>
      <small>专业版 v10.0</small>
    </div>

    <div class="mode-switch">
      <button class="mode-btn active" data-mode="free" id="modeFreeBtn">🎆 自由模式</button>
      <button class="mode-btn" data-mode="business" id="modeBizBtn">💼 经营模式</button>
    </div>

    <div class="card business-card" id="businessCard">
      <div class="card-title">经营状态</div>

      <div class="business-balance">
        <div class="business-balance-label">当前资金（模拟）</div>
        <div class="business-balance-num" id="bizBalance">¥10,000</div>
      </div>

      <div class="business-stats">
        <div class="biz-stat"><span>总收入</span><b id="bizIncome">¥0</b></div>
        <div class="biz-stat"><span>总支出</span><b id="bizExpense">¥0</b></div>
        <div class="biz-stat"><span>净盈亏</span><b id="bizProfit">¥0</b></div>
        <div class="biz-stat"><span>燃放次数</span><b id="bizCount">0</b></div>
      </div>

      <div class="milestone-panel">
        <div class="milestone-header">
          <div class="milestone-header-icon" id="milestoneIcon">🥉</div>
          <div class="milestone-header-text">
            <div class="milestone-header-title">下一里程碑</div>
            <div class="milestone-header-name" id="milestoneName">小有所成</div>
          </div>
          <div class="milestone-pct" id="milestonePct">0.0%</div>
        </div>
        <div class="milestone-bar">
          <div class="milestone-fill" id="milestoneFill"></div>
        </div>
        <div class="milestone-next" id="milestoneNext">目标：¥50,000</div>
      </div>

      <div class="chart-wrap">
        <div class="chart-header">
          <div class="chart-title">资金走势</div>
          <div class="chart-legend">
            <div class="chart-legend-dot"></div>
            <span>余额</span>
          </div>
        </div>
        <canvas id="bizChart"></canvas>
      </div>

      <div class="badges-wrap">
        <div class="badges-title">里程碑徽章</div>
        <div class="badges-list" id="badgesList"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">夜景地图</div>
      <div class="scene-list" id="sceneBox"></div>
    </div>

    <div class="card">
      <div class="card-title" id="fwListTitle">烟花种类 · 真实市价</div>
      <div id="catBox"></div>
    </div>

    <div class="card">
      <div class="card-title">设置</div>
      <div class="settings-grid">
        <button class="settings-btn" id="soundToggleBtn">
          <span class="settings-icon" id="soundIcon">🔊</span>
          <span class="settings-label">音效</span>
          <span class="settings-value" id="soundValue">开启</span>
        </button>
        <button class="settings-btn" id="qualityToggleBtn">
          <span class="settings-icon" id="qualityIcon">✨</span>
          <span class="settings-label">画质</span>
          <span class="settings-value" id="qualityValue">高</span>
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">操作台</div>
      <div class="btn-row">
        <button class="btn help" id="guideBtn">🎓 新手指导</button>
        <button class="btn" id="pauseBtn">⏸ 暂停游戏</button>
        <button class="btn" id="autoBtn">🎇 自动燃放</button>
        <button class="btn warn" id="clearSceneBtn">🧹 清空场景</button>
        <button class="btn danger" id="resetBtn">🧾 结算并清空账单</button>
        <button class="btn good" id="restartBizBtn" style="display:none;">🔄 重置经营数据</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title" id="billTitle">本次烟花秀花费</div>
      <div class="total-box">
        <div class="total-num" id="totalEl">¥0</div>
        <div class="total-sub" id="totalSubEl">共燃放 0 发</div>
      </div>
      <div class="bill" id="billEl">
        <div class="bill-empty">还没有燃放烟花</div>
      </div>
    </div>

  </aside>
</div>

<div class="toast" id="toastEl"></div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirmIcon">⚠️</div>
    <div class="confirm-title" id="confirmTitle">提示</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" id="confirmCancel">取消</button>
      <button class="confirm-btn ok" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div class="milestone-overlay" id="milestoneOverlay">
  <div class="milestone-box">
    <div class="milestone-icon" id="msIcon">🥉</div>
    <div class="milestone-title">里程碑达成</div>
    <div class="milestone-name" id="msName">小有所成</div>
    <div class="milestone-amount" id="msAmount"></div>
    <div class="milestone-reward" id="msReward"></div>
    <button class="milestone-close" id="msClose">太棒了！</button>
  </div>
</div>

<div class="guide-overlay" id="guideOverlay">
  <div class="guide-spot" id="guideSpot"></div>
  <div class="guide-tip" id="guideTip">
    <div class="guide-tip-head">
      <span class="guide-step-icon" id="guideIcon">🎆</span>
      <div class="guide-step-text">
        <div class="guide-step-label" id="guideLabel">新手指导 · 1 / 9</div>
        <div class="guide-step-title" id="guideTitle">欢迎</div>
      </div>
      <button class="guide-close" id="guideCloseBtn" type="button" aria-label="关闭引导">✕</button>
    </div>
    <div id="guideBody"></div>
    <div class="guide-dots" id="guideDots"></div>
    <div class="guide-actions">
      <button class="guide-btn ghost" id="guideSkipBtn" type="button">跳过</button>
      <button class="guide-btn" id="guidePrevBtn" type="button">上一步</button>
      <button class="guide-btn primary" id="guideNextBtn" type="button">下一步</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   工具函数
   ============================================================ */
var TAU = Math.PI * 2;

function rand(a, b) {
  return a + Math.random() * (b - a);
}

function randInt(a, b) {
  return Math.floor(a + Math.random() * (b - a + 1));
}

function pick(arr) {
  return arr[(Math.random() * arr.length) | 0];
}

function clamp(v, a, b) {
  return v < a ? a : (v > b ? b : v);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function easeOutQuad(t) {
  return 1 - Math.pow(1 - t, 2);
}

function easeInOutQuad(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

function fmtMoney(n) {
  return "¥" + Math.round(n).toLocaleString("zh-CN");
}

function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hexToRgbArr(hex) {
  var h = hex.replace("#", "");
  if (h.length === 3) {
    h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  }
  return [
    parseInt(h.substring(0, 2), 16),
    parseInt(h.substring(2, 4), 16),
    parseInt(h.substring(4, 6), 16)
  ];
}

function hexToRgba(hex, alpha) {
  var c = hexToRgbArr(hex);
  return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + alpha + ")";
}

function nightShade(hex, brightness) {
  var c = hexToRgbArr(hex);
  var f = brightness === undefined ? 0.72 : brightness;
  var r = clamp(Math.round(c[0] * f), 0, 255);
  var g = clamp(Math.round(c[1] * f * 1.02), 0, 255);
  var b = clamp(Math.round(c[2] * f * 1.1), 0, 255);
  return "rgb(" + r + "," + g + "," + b + ")";
}

/* ============================================================
   音频引擎
   ============================================================ */
var audioEngine = {
  ctx: null,
  masterGain: null,
  muted: false,
  supported: true,
  activeVoices: 0,
  maxVoices: 12,
  noiseCache: {},

  init: function () {
    if (this.ctx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) {
        this.supported = false;
        return;
      }
      this.ctx = new AC();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = this.muted ? 0 : 0.32;
      this.masterGain.connect(this.ctx.destination);
    } catch (e) {
      this.supported = false;
    }
  },

  resume: function () {
    if (this.ctx && this.ctx.state === "suspended") {
      try { this.ctx.resume(); } catch (e) {}
    }
  },

  setMuted: function (m) {
    this.muted = m;
    if (this.masterGain && this.ctx) {
      var t = this.ctx.currentTime;
      this.masterGain.gain.cancelScheduledValues(t);
      this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, t);
      this.masterGain.gain.linearRampToValueAtTime(m ? 0 : 0.32, t + 0.1);
    }
  },

  getNoise: function (duration) {
    if (!this.ctx) return null;
    var key = Math.round(duration * 10);
    if (this.noiseCache[key]) return this.noiseCache[key];
    var sampleRate = this.ctx.sampleRate;
    var len = Math.max(1, Math.round(sampleRate * duration));
    var buf = this.ctx.createBuffer(1, len, sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    this.noiseCache[key] = buf;
    return buf;
  },

  explosion: function (opts) {
    if (!this.supported || this.muted || !this.ctx) return;
    if (this.activeVoices >= this.maxVoices) return;
    this.activeVoices++;

    opts = opts || {};
    var intensity = opts.intensity !== undefined ? opts.intensity : 0.5;
    var pitch = opts.pitch !== undefined ? opts.pitch : 1;

    var ctx = this.ctx;
    var now = ctx.currentTime;
    var dur = 0.4 + intensity * 0.9;

    var noiseBuf = this.getNoise(dur);
    if (!noiseBuf) { this.activeVoices--; return; }

    var noise = ctx.createBufferSource();
    noise.buffer = noiseBuf;

    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    var baseF = (1800 + intensity * 1500) * pitch;
    filter.frequency.setValueAtTime(baseF, now);
    filter.frequency.exponentialRampToValueAtTime(80, now + dur);
    filter.Q.value = 0.8;

    var gain = ctx.createGain();
    var vol = 0.18 + intensity * 0.22;
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    noise.start(now);
    noise.stop(now + dur);

    var osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(140 * pitch, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.35);

    var oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.22 * intensity, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

    osc.connect(oscGain);
    oscGain.connect(this.masterGain);
    osc.start(now);
    osc.stop(now + 0.45);

    var self = this;
    setTimeout(function () { self.activeVoices--; }, (dur + 0.5) * 1000);
  },

  crackle: function (duration, volume) {
    if (!this.supported || this.muted || !this.ctx) return;
    if (this.activeVoices >= this.maxVoices) return;
    this.activeVoices++;

    var ctx = this.ctx;
    var now = ctx.currentTime;
    var dur = duration || 0.8;
    var vol = volume !== undefined ? volume : 0.06;

    var noiseBuf = this.getNoise(dur);
    if (!noiseBuf) { this.activeVoices--; return; }

    var noise = ctx.createBufferSource();
    noise.buffer = noiseBuf;

    var filter = ctx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 1800;

    var gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.linearRampToValueAtTime(vol * 0.7, now + dur * 0.5);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    noise.start(now);
    noise.stop(now + dur);

    var self = this;
    setTimeout(function () { self.activeVoices--; }, (dur + 0.3) * 1000);
  },

  whistle: function (dur) {
    if (!this.supported || this.muted || !this.ctx) return;
    if (this.activeVoices >= this.maxVoices) return;
    this.activeVoices++;

    var ctx = this.ctx;
    var now = ctx.currentTime;
    dur = dur || 0.6;

    var osc = ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(900, now);
    osc.frequency.exponentialRampToValueAtTime(220, now + dur);

    var filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 600;
    filter.Q.value = 4;

    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.05, now + dur * 0.6);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    osc.start(now);
    osc.stop(now + dur);

    var self = this;
    setTimeout(function () { self.activeVoices--; }, (dur + 0.3) * 1000);
  },

  droneBuzz: function (dur) {
    if (!this.supported || this.muted || !this.ctx) return;
    if (this.activeVoices >= this.maxVoices) return;
    this.activeVoices++;

    var ctx = this.ctx;
    var now = ctx.currentTime;
    dur = dur || 1.2;

    var osc1 = ctx.createOscillator();
    osc1.type = "sawtooth";
    osc1.frequency.value = 118;

    var osc2 = ctx.createOscillator();
    osc2.type = "sawtooth";
    osc2.frequency.value = 122;

    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 380;

    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.022, now + dur * 0.25);
    gain.gain.linearRampToValueAtTime(0.02, now + dur * 0.75);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + dur);
    osc2.stop(now + dur);

    var self = this;
    setTimeout(function () { self.activeVoices--; }, (dur + 0.3) * 1000);
  },

  coin: function () {
    if (!this.supported || this.muted || !this.ctx) return;
    var ctx = this.ctx;
    var now = ctx.currentTime;

    var osc = ctx.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(988, now);
    osc.frequency.setValueAtTime(1319, now + 0.08);

    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.09, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(now);
    osc.stop(now + 0.32);
  },

  milestone: function () {
    if (!this.supported || this.muted || !this.ctx) return;
    var ctx = this.ctx;
    var now = ctx.currentTime;
    var notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
    var self = this;

    notes.forEach(function (f, i) {
      var osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f;

      var gain = ctx.createGain();
      var t = now + i * 0.1;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);

      osc.connect(gain);
      gain.connect(self.masterGain);
      osc.start(t);
      osc.stop(t + 0.55);
    });
  },

  bankrupt: function () {
    if (!this.supported || this.muted || !this.ctx) return;
    var ctx = this.ctx;
    var now = ctx.currentTime;
    var notes = [440, 392, 349, 294, 247, 220];
    var self = this;

    notes.forEach(function (f, i) {
      var osc = ctx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.value = f;

      var filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 800;

      var gain = ctx.createGain();
      var t = now + i * 0.15;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.08, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(self.masterGain);
      osc.start(t);
      osc.stop(t + 0.32);
    });
  }
};

/* ============================================================
   载具系统
   ============================================================ */
function spawnVehicle(type, x, y, opts) {
  opts = opts || {};
  var life = opts.life !== undefined ? opts.life : 3000;

  var v = {
    type: type,
    x: x,
    y: y,
    angle: opts.angle || 0,
    scale: opts.scale !== undefined ? opts.scale : 1,
    life: life,
    maxLife: life,
    phase: Math.random() * TAU,
    bodyColor: opts.bodyColor || "#c8232c",
    tubeW: opts.tubeW !== undefined ? opts.tubeW : 13,
    tubeH: opts.tubeH !== undefined ? opts.tubeH : 34,
    boxW: opts.boxW !== undefined ? opts.boxW : 46,
    boxH: opts.boxH !== undefined ? opts.boxH : 30,
    tubeRows: opts.tubeRows !== undefined ? opts.tubeRows : 3
  };

  state.vehicles.push(v);
  return v;
}

function getNozzle(v) {
  if (!v) return null;

  switch (v.type) {
    case "groundSprayer":
    case "coneSprayer":
    case "mortarTube":
      return { x: v.x, y: v.y - v.tubeH };

    case "groundBox":
    case "bigBox":
    case "cakeBox":
      return { x: v.x, y: v.y - v.boxH };

    case "commercialRack":
      return { x: v.x, y: v.y - v.boxH * 0.42 - 12 * 2 - 18 };

    case "fanRack":
      return { x: v.x, y: v.y - v.boxH * 0.55 - 34 };

    case "handTube":
      return { x: v.x, y: v.y - 28 * v.scale };

    case "launcherStick":
      return { x: v.x, y: v.y - 15 * v.scale };

    case "gatling":
      return { x: v.x + 26 * v.scale, y: v.y };

    default:
      return { x: v.x, y: v.y };
  }
}

function removeVehicle(v) {
  var idx = state.vehicles.indexOf(v);
  if (idx >= 0) state.vehicles.splice(idx, 1);
}

function updateVehicles(dt) {
  var vs = state.vehicles;
  for (var i = vs.length - 1; i >= 0; i--) {
    vs[i].life -= dt;
    if (vs[i].life <= 0) vs.splice(i, 1);
  }
}

  return {

    grav: opt.grav !== undefined ? opt.grav : 0.045,
    alpha: opt.alpha !== undefined ? opt.alpha : 1,
    flicker: !!opt.flicker,
    glow: opt.glow !== false,
    trail: opt.trail !== false,
    splitAt: undefined,
    splitColors: null,
    dead: false
  };
}

function schedule(delay, fn) {

}

/* ============================================================
   爆炸
   ============================================================ */
function explode(x, y, opt) {
  opt = opt || {};

  var count = opt.count || 80;
  var speed = opt.speed || 5;
  var colors = opt.colors || PALETTES.gold;
  var life = opt.life || 1400;
  var size = opt.size || 2;
  var grav = opt.grav !== undefined ? opt.grav : 0.045;
  var drag = opt.drag !== undefined ? opt.drag : 0.975;
  var pattern = opt.pattern || "peony";
  var rot = opt.rot || 0;
  var main = pick(colors);

  state.particles.push(makeParticle(x, y, 0, 0, {
    life: 240, color: "#ffffff",
    size: size * 4.2, drag: 1, grav: 0,
    alpha: 0.95, glow: true, trail: false
  }));

  state.particles.push(makeParticle(x, y, 0, 0, {
    life: 360, color: main,
    size: size * 2.8, drag: 1, grav: 0,
    alpha: 0.7, glow: true, trail: false
  }));

  for (var i = 0; i < 10; i++) {
    var a0 = Math.random() * TAU;
    var sp0 = speed * 0.42 * rand(0.7, 1.3);
    state.particles.push(makeParticle(x, y, Math.cos(a0) * sp0, Math.sin(a0) * sp0, {
      life: randInt(420, 950),
      color: pick(colors),
      size: size * rand(1.4, 2.2),
      drag: 0.965,
      grav: grav * 0.35,
      alpha: 0.32,
      glow: true,
      trail: false
    }));
  }

  for (var j = 0; j < count; j++) {
    var ang, sp;

    switch (pattern) {
      case "ring":
        ang = (j / count) * TAU + rot;
        sp = speed * rand(0.93, 1.07);
        break;
      case "willow":
        ang = Math.random() * TAU;
        sp = speed * Math.sqrt(Math.random()) * 0.72;
        break;
      case "chrysanthemum":
        ang = Math.random() * TAU;
        sp = speed * rand(0.85, 1.0);
        break;
      default:
        ang = Math.random() * TAU;
        sp = speed * Math.sqrt(Math.random());
    }

    var col;
    if (pattern === "willow") {
      col = pick(["#ffd97a", "#ffbe4d", "#fff0b8", "#ffcf5c"]);
    } else if (Math.random() < 0.72) {
      col = main;
    } else {
      col = pick(colors);
    }

    var p = makeParticle(
      x, y,
      Math.cos(ang) * sp,
      Math.sin(ang) * sp,
      {
        life: Math.round(life * rand(0.6, 1.15)),
        color: col,
        size: size * rand(0.7, 1.4),
        drag: drag,
        grav: grav,
        flicker: Math.random() < 0.25,
        glow: true,
        trail: true
      }
    );

    if (pattern === "crossette" && Math.random() < 0.45) {
      p.splitAt = Math.round(life * rand(0.45, 0.7));
      p.splitColors = colors;
    }

    state.particles.push(p);
  }
}

/* ============================================================
   升空火箭
   ============================================================ */
function launchShell(targetX, targetY, opt) {
  opt = opt || {};

  var spreadX = opt.spreadX !== undefined ? opt.spreadX : 30;

  var startX = opt.startX !== undefined
    ? clamp(opt.startX, 8, W - 8)
    : clamp(targetX + rand(-spreadX, spreadX), 8, W - 8);

  var startY = opt.startY !== undefined ? opt.startY : H + 12;

  var dist = Math.max(60, startY - targetY);
  var speed = opt.speed || 900;
  var dur = clamp((dist / speed) * 1000, 380, 2200);

  var r = {
    startX: startX,
    startY: startY,
    x: startX,
    y: startY,
    px: startX,
    py: startY,
    targetX: targetX,
    targetY: targetY,
    t: 0,
    dur: dur,
    trailColor: opt.trailColor || "#ffd27a",
    trailSize: opt.trailSize || 1.6,
    onEnd: opt.onEnd || null,
    vehicle: null
  };

  var vType = opt.vehicleType || "rocket";
  if (vType !== "none") {
    r.vehicle = spawnVehicle(vType, startX, startY, {
      life: dur + 120,
      bodyColor: opt.bodyColor || "#c8232c",
      scale: opt.vehicleScale !== undefined ? opt.vehicleScale : 0.85,
      angle: 0
    });
  }

  state.rockets.push(r);
  return r;
}

/* ---------- 无人机投放式爆炸 ---------- */
function droneDropBurst(drone, dx, dy, palette, scaleFactor) {
  var isUp = Math.random() < 0.5;
  var maxOffset = isUp ? Math.max(60, dy - 50) : Math.max(60, H * 0.58 - dy);
  var offset = Math.min(rand(80, 140), maxOffset);
  var burstY = isUp ? dy - offset : dy + offset;

  for (var n = 0; n < 6; n++) {
    var tt = n / 6;
    var px = dx + rand(-3, 3);
    var py = lerp(dy, burstY, tt);
    state.particles.push(makeParticle(
      px, py,
      rand(-0.4, 0.4),
      isUp ? -rand(1.2, 2.4) : rand(1.2, 2.4),
      {
        life: randInt(220, 460),
        color: pick([drone.color, "#ffffff", "#ffe9a0"]),
        size: rand(1.0, 1.8),
        drag: 0.94, grav: 0.01,
        flicker: true, glow: true, trail: false
      }
    ));
  }

  explode(dx, burstY, {
    count: Math.round(78 * scaleFactor),
    speed: 5.6,
    colors: palette,
    life: 1700,
    size: 2.0
  });
  audioEngine.explosion({ intensity: 0.5 });
  state.flash = Math.max(state.flash, 0.3);
}

function droneRingSpray(drone, dx, dy, palette) {
  var baseY = dy + 10;
  for (var i = 0; i < 22; i++) {
    var a = (i / 22) * TAU;
    var sp = rand(3.5, 6.0);
    state.particles.push(makeParticle(
      dx + Math.cos(a) * 5,
      baseY + Math.sin(a) * 5,
      Math.cos(a) * sp,
      Math.sin(a) * sp + 0.4,
      {
        life: randInt(700, 1400),
        color: pick(palette),
        size: rand(1.3, 2.2),
        drag: 0.965, grav: 0.05,
        flicker: true, glow: true
      }
    ));
  }
}

  var duration = item.duration;
  var count = 6;

  var descentDur = 4000;
  var hoverEnd = duration - descentDur;

  var cx = clamp(x, W * 0.3, W * 0.7);

      var tx = clamp(cx + Math.cos(angle) * radius, 30, W - 30);
      var ty = clamp(cy + Math.sin(angle) * radius * 0.72, 30, H * 0.55);

      var offset = idx * 280;

      for (var t = 3600 + offset; t < hoverEnd - 300; t += 1900) emitAt.push(t);

      spawnDrone({
        startX: clamp(tx + rand(-20, 20), 20, W - 20),

        targetX: tx,
        targetY: ty,
        endX: clamp(tx + rand(-30, 30), 20, W - 20),

        totalDur: duration,
        color: idx % 2 === 0 ? "#5ad2ff" : "#b08cff",

function fxDroneWaterfall(x, y, item) {
  var duration = item.duration;
  var count = 8;
  var riseDur = 2600;
  var descentDur = 4200;

  var startY = H + 30;

  audioEngine.droneBuzz(3.0);

  for (var i = 0; i < count; i++) {
    (function (idx) {
      var t = count === 1 ? 0.5 : idx / (count - 1);

      for (var et = riseDur + 500; et < hoverEnd - 200; et += 340) emitAt.push(et);

      spawnDrone({
        startX: tx, startY: startY,

        endX: tx, endY: startY,

        color: idx % 2 === 0 ? "#5ad2ff" : "#ffd166",

}

var DRONE_SHAPES = {
  lantern: function (i, n) {
    var ellipseEnd = 22;
    if (i < ellipseEnd) {
      var a = (i / ellipseEnd) * TAU - Math.PI / 2;
      return { x: Math.cos(a) * 0.78, y: Math.sin(a) * 0.88 };
    } else if (i < ellipseEnd + 4) {
      var k = (i - ellipseEnd) / 3;
      return { x: (k - 0.5) * 0.20, y: -1.06 - k * 0.10 };
    } else {
      var k2 = (i - ellipseEnd - 4) / 3;
      return { x: (k2 - 0.5) * 0.28, y: 1.05 + k2 * 0.14 };
    }
  },
  heart: function (i, n) {
    var t = (i / n) * TAU;
    var xm = 16 * Math.pow(Math.sin(t), 3);
    var ym = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: xm / 17, y: -ym / 17 };
  },
  star: function (i, n) {
    var totalVerts = 10;
    var pos = (i / n) * totalVerts;
    var segIdx = Math.floor(pos) % totalVerts;
    var t = pos - Math.floor(pos);

    function getVertex(k) {
      var angle = -Math.PI / 2 + (k / totalVerts) * TAU;
      var r = k % 2 === 0 ? 1.0 : 0.42;
      return { x: Math.cos(angle) * r, y: Math.sin(angle) * r };
    }

    var v1 = getVertex(segIdx);
    var v2 = getVertex((segIdx + 1) % totalVerts);
    return { x: lerp(v1.x, v2.x, t), y: lerp(v1.y, v2.y, t) };
  },
  ring: function (i, n) {
    var a = (i / n) * TAU;
    return { x: Math.cos(a) * 0.9, y: Math.sin(a) * 0.9 };
  },
  flower: function (i, n) {
    var a = (i / n) * TAU;
    var petals = 6;
    var r = 0.48 + 0.42 * Math.cos(a * petals);
    return { x: Math.cos(a) * r, y: Math.sin(a) * r };
  }
};

function fxDroneLantern(x, y, item) {
  var duration = item.duration;
  var droneCount = 30;

  var riseDur = 3400;
  var descentDur = 3800;
  var launchWindow = 1600;
  var formationStart = riseDur + 500;
  var formationEnd = duration - descentDur - launchWindow;
  var shapeCount = 5;
  var shapeDur = (formationEnd - formationStart) / shapeCount;
  var transitionDur = Math.min(1600, shapeDur * 0.35);

  var cx = clamp(x, W * 0.32, W * 0.68);
  var cy = clamp(y, H * 0.20, H * 0.36);
  var scale = Math.min(W, H) * 0.20;

  var shapes = [
    DRONE_SHAPES.lantern,
    DRONE_SHAPES.heart,
    DRONE_SHAPES.star,
    DRONE_SHAPES.ring,
    DRONE_SHAPES.flower
  ];

  var colorPalette = [
    "#ff4d4d", "#ff8c42", "#ffd93d", "#4dff88",
    "#4fc3ff", "#7c6bff", "#ff5edb", "#ffb347"
  ];

  audioEngine.droneBuzz(3.5);

  for (var i = 0; i < droneCount; i++) {
    (function (idx) {
      var spreadK = droneCount === 1 ? 0.5 : idx / (droneCount - 1);
      var startX = clamp(cx + (spreadK - 0.5) * W * 0.7 + rand(-15, 15), 20, W - 20);
      var startY = H + 40 + idx * 3;

      var shapePositions = [];
      for (var s = 0; s < shapeCount; s++) {
        var pos = shapes[s](idx, droneCount);
        shapePositions.push({ x: cx + pos.x * scale, y: cy + pos.y * scale });
      }

      var keyframes = [];
      keyframes.push({ t: 0, x: startX, y: startY });
      keyframes.push({ t: riseDur, x: shapePositions[0].x, y: shapePositions[0].y });

      for (var s2 = 1; s2 < shapeCount; s2++) {
        var tStart = formationStart + s2 * shapeDur;
        keyframes.push({ t: tStart, x: shapePositions[s2 - 1].x, y: shapePositions[s2 - 1].y });
        keyframes.push({ t: tStart + transitionDur, x: shapePositions[s2].x, y: shapePositions[s2].y });
      }

      var descentStart = duration - descentDur;
      keyframes.push({
        t: descentStart,
        x: shapePositions[shapeCount - 1].x,
        y: shapePositions[shapeCount - 1].y
      });

      var endX = clamp(cx + (spreadK - 0.5) * W * 0.8 + rand(-30, 30), 20, W - 20);
      var endY = H + 60 + idx * 3;
      keyframes.push({ t: duration, x: endX, y: endY });

      var emitAt = [];
      for (var k = 0; k < 2; k++) {
        var t2 = duration - descentDur - launchWindow + idx * 30 + k * 700;
        if (t2 > 0 && t2 < duration - 200) emitAt.push(t2);
      }

      var droneColor = colorPalette[idx % colorPalette.length];

      spawnDrone({
        startX: startX, startY: startY,
        targetX: shapePositions[0].x, targetY: shapePositions[0].y,
        endX: endX, endY: endY,
        riseDur: riseDur, descentDur: descentDur, totalDur: duration,
        color: droneColor, size: 0.68,
        emitAt: emitAt,
        burstFn: function (dx, dy, drone) {
          var isUp = Math.random() < 0.5;
          var offset = rand(55, 95);
          var burstY = isUp ? dy - offset : dy + offset;

          for (var n = 0; n < 5; n++) {
            state.particles.push(makeParticle(
              dx + rand(-2, 2),
              lerp(dy, burstY, n / 5),
              rand(-0.3, 0.3),
              isUp ? -rand(0.8, 1.6) : rand(0.8, 1.6),
              {
                life: randInt(180, 360),
                color: drone.color, size: 1.1,
                drag: 0.94, grav: 0.01,
                flicker: true, glow: true, trail: false
              }
            ));
          }

          explode(dx, burstY, {
            count: 38, speed: 4.4,
            colors: [drone.color, "#ffffff", "#ffe9a0"],
            life: 1400, size: 1.7
          });
          audioEngine.explosion({ intensity: 0.4 });
        },
        formation: { keyframes: keyframes, isFormation: true }
      });
    })(i);
  }

  schedule(formationStart, function () {
    state.flash = Math.max(state.flash, 0.20);
  });
}

function fxDroneDragon(x, y, item) {
  var duration = item.duration;
  var count = 12;
  var riseDur = 2600;
  var descentDur = 4400;
  var hoverEnd = duration - descentDur;

  var cx = clamp(x, W * 0.35, W * 0.65);
  var cy = clamp(y, H * 0.18, H * 0.38);
  var baseR = Math.min(W, H) * 0.24;

  audioEngine.droneBuzz(3.2);

  for (var i = 0; i < count; i++) {
    (function (idx) {
      var angle = (idx / count) * TAU;
      var tx = clamp(cx + Math.cos(angle) * baseR, 30, W - 30);
      var ty = clamp(cy + Math.sin(angle) * baseR * 0.62, 30, H * 0.56);

      var offset = idx * 220;
      var emitAt = [];
      for (var t = 3800 + offset; t < hoverEnd - 400; t += 2300) emitAt.push(t);

      var droneColor = idx % 3 === 0 ? "#ffd166" : (idx % 3 === 1 ? "#5ad2ff" : "#ff6bcb");

      spawnDrone({
        startX: clamp(tx + rand(-25, 25), 20, W - 20),
        startY: H + 30,
        targetX: tx, targetY: ty,
        endX: clamp(tx + rand(-50, 50), 20, W - 20),
        endY: H + 50,
        riseDur: riseDur + (idx % 4) * 180,
        descentDur: descentDur + (idx % 3) * 140,
        totalDur: duration,
        color: droneColor, size: 0.9,
        emitAt: emitAt,
        burstFn: function (dx, dy, drone) {
          var palette = drone.color === "#ffd166" ? PALETTES.gold :
                        drone.color === "#5ad2ff" ? PALETTES.cool : PALETTES.pink;

          var roll = Math.random();
          if (roll < 0.5) {
            droneDropBurst(drone, dx, dy, palette, 0.95);
          } else if (roll < 0.8) {
            droneRingSpray(drone, dx, dy, palette);
          } else {
            for (var ring = 0; ring < 2; ring++) {
              var rr = 4 + ring * 4;
              var n = 16 + ring * 6;
              for (var i2 = 0; i2 < n; i2++) {
                var a = (i2 / n) * TAU + ring * 0.2;
                var sp = rand(3.0, 5.0) * (1 - ring * 0.2);
                state.particles.push(makeParticle(
                  dx + Math.cos(a) * rr,
                  dy + 6 + Math.sin(a) * rr,
                  Math.cos(a) * sp,
                  Math.sin(a) * sp,
                  {
                    life: randInt(600, 1200),
                    color: ring === 0 ? "#ffffff" : pick(palette),
                    size: rand(1.2, 2.1),
                    drag: 0.96, grav: 0.05,
                    flicker: true, glow: true
                  }
                ));
              }
            }
          }
        }
      });
    })(i);
  }

  schedule(hoverEnd - 1000, function () {
    for (var k = 0; k < 7; k++) {
      (function (idx) {
        schedule(idx * 130, function () {
          var groundY = getGroundY();
          var tx = clamp(x + rand(-W * 0.4, W * 0.4), 40, W - 40);
          var ty = clamp(y + rand(-H * 0.3, H * 0.1), 40, H * 0.5);
          launchShell(tx, ty, {
            speed: 1300, spreadX: 20,
            startY: groundY - 10,
            trailColor: "#ffd166",
            vehicleType: "slimRocket", bodyColor: "#ffd166", vehicleScale: 0.85,
            onEnd: function (r) {
              explode(r.x, r.y, {
                count: 130, speed: 7.4,
                colors: PALETTES.rainbow, life: 2000, size: 2.4
              });
              audioEngine.explosion({ intensity: 0.8 });
            }
          });
        });
      })(k);
    }
  });
}
