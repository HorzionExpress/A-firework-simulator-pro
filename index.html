   载具绘制（简化为几何图形，保证性能）
   ============================================================ */
function drawVehicle(v) {
  var t = state.time;

  switch (v.type) {
    case "sparkler":
    case "electric": {
      var fade = Math.min(600, v.maxLife * 0.25);
      var alpha = v.life < fade ? v.life / fade : 1;
      ctx.save();
      ctx.globalAlpha = alpha;

      /* 杆子 */
      ctx.strokeStyle = "#4a4e5c";
      ctx.lineWidth = 2 * v.scale;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(v.x, v.y + 3);
      ctx.lineTo(v.x, v.y + 40 * v.scale);
      ctx.stroke();

      /* 尖端光晕 */
      var g = ctx.createRadialGradient(v.x, v.y, 0, v.x, v.y, 18);
      var tipColor = v.type === "electric" ? "#bfe6ff" : "#ffd45e";
      g.addColorStop(0, "rgba(255, 255, 255, 0.9)");
      g.addColorStop(0.3, hexToRgba(tipColor, 0.6));
      g.addColorStop(1, hexToRgba(tipColor, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(v.x, v.y, 18, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(v.x, v.y, 2.5 * v.scale, 0, TAU);
      ctx.fill();

      ctx.restore();
      break;
    }

    case "handTube": {
      var alpha2 = clamp(v.life / 500, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha2;

      var w = 6 * v.scale;
      var h = 28 * v.scale;

      ctx.fillStyle = "#4a3a2a";
      ctx.fillRect(v.x - w * 0.5, v.y - h, w, h);

      ctx.fillStyle = "#ffd166";
      ctx.fillRect(v.x - w * 0.6, v.y - h - 3, w * 1.2, 3);

      var pulse = 0.5 + 0.5 * Math.sin(t * 0.01);
      var g2 = ctx.createRadialGradient(v.x, v.y - h, 0, v.x, v.y - h, 16);
      g2.addColorStop(0, "rgba(255, 230, 140, " + (0.7 * pulse) + ")");
      g2.addColorStop(1, "rgba(255, 200, 80, 0)");
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(v.x, v.y - h, 16, 0, TAU);
      ctx.fill();

      ctx.restore();
      break;
    }

    case "bee": {
      var alpha3 = clamp(v.life / 500, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha3;
      ctx.translate(v.x, v.y);

      var spin = t * 0.008;
      ctx.rotate(spin);

      ctx.fillStyle = "#ffd93d";
      ctx.beginPath();
      ctx.ellipse(0, 0, 8 * v.scale, 5 * v.scale, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#111";
      ctx.fillRect(-8 * v.scale, -1 * v.scale, 16 * v.scale, 2 * v.scale);

      ctx.fillStyle = "rgba(220, 240, 255, 0.6)";
      ctx.save();
      ctx.rotate(spin * 0.5);
      ctx.beginPath();
      ctx.ellipse(9 * v.scale, 0, 7 * v.scale, 3 * v.scale, 0.3, 0, TAU);
      ctx.fill();
      ctx.restore();

      ctx.restore();
      break;
    }

    case "pinwheel": {
      var alpha4 = clamp(v.life / 600, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha4;
      ctx.translate(v.x, v.y);

      var spin2 = t * 0.012;

      ctx.strokeStyle = "#4a3a2a";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.lineTo(0, 36);
      ctx.stroke();

      ctx.save();
      ctx.rotate(spin2);
      var colors = PALETTES.rainbow;
      for (var i = 0; i < 4; i++) {
        ctx.save();
        ctx.rotate((i / 4) * TAU);
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(20, -6);
        ctx.lineTo(22, 2);
        ctx.lineTo(0, 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();

      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, TAU);
      ctx.fill();

      ctx.restore();
      break;
    }

    case "groundSprayer": {
      var alpha5 = clamp(v.life / 600, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha5;

      var w2 = v.tubeW;
      var h2 = v.tubeH;

      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y + 2, w2 * 0.9, 4, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#3a3e48";
      ctx.fillRect(v.x - w2 * 0.5, v.y - h2, w2, h2);

      ctx.fillStyle = "#1a1c22";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y - h2, w2 * 0.5, w2 * 0.2, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "rgba(255, 200, 80, 0.35)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y - h2, w2 * 0.32, w2 * 0.12, 0, 0, TAU);
      ctx.fill();

      ctx.restore();
      break;
    }

    case "coneSprayer": {
      var alpha6 = clamp(v.life / 700, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha6;

      var w3 = v.tubeW;
      var h3 = v.tubeH;

      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y + 2, w3 * 0.9, 4, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#3a4050";
      ctx.beginPath();
      ctx.moveTo(v.x - w3 * 0.5, v.y);
      ctx.lineTo(v.x + w3 * 0.5, v.y);
      ctx.lineTo(v.x + w3 * 0.15, v.y - h3);
      ctx.lineTo(v.x - w3 * 0.15, v.y - h3);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(230, 245, 255, 0.35)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y - h3, w3 * 0.14, w3 * 0.05, 0, 0, TAU);
      ctx.fill();

      ctx.restore();
      break;
    }

    case "spinDisk": {
      var alpha7 = clamp(v.life / 600, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha7;
      ctx.translate(v.x, v.y);

      var spin3 = t * 0.006;
      ctx.rotate(spin3);

      ctx.fillStyle = "#3a3e48";
      for (var k = 0; k < 6; k++) {
        ctx.save();
        ctx.rotate((k / 6) * TAU);
        ctx.fillRect(3, -1.5, 16, 3);
        ctx.restore();
      }

      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, TAU);
      ctx.fill();

      ctx.restore();
      break;
    }

    case "groundBox": {
      var alpha8 = clamp(v.life / 800, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha8;

      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y + 2, v.boxW * 0.55, 5, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#7a1a24";
      ctx.fillRect(v.x - v.boxW * 0.5, v.y - v.boxH, v.boxW, v.boxH);

      ctx.fillStyle = "#1a0808";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y - v.boxH, v.boxW * 0.5, 4, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#ffd166";
      ctx.fillRect(v.x - v.boxW * 0.5, v.y - v.boxH * 0.6, v.boxW, 2);

      ctx.restore();
      break;
    }

    case "bigBox": {
      var alpha9 = clamp(v.life / 900, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha9;

      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y + 2, v.boxW * 0.6, 6, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#6a1a30";
      ctx.fillRect(v.x - v.boxW * 0.5, v.y - v.boxH, v.boxW, v.boxH);

      ctx.fillStyle = "#0a0608";
      ctx.fillRect(v.x - v.boxW * 0.44, v.y - v.boxH, v.boxW * 0.88, 6);

      ctx.fillStyle = "rgba(230, 200, 120, 0.5)";
      ctx.fillRect(v.x - v.boxW * 0.35, v.y - v.boxH * 0.45, v.boxW * 0.7, 2);

      ctx.restore();
      break;
    }

    case "launcherStick": {
      var alphaA = clamp(v.life / 800, 0, 1);
      ctx.save();
      ctx.globalAlpha = alphaA;

      ctx.fillStyle = "rgba(35, 28, 20, 0.6)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y, 11, 3.6, 0, 0, TAU);
      ctx.fill();

      ctx.strokeStyle = "#4a3e2c";
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(v.x - 7, v.y);
      ctx.lineTo(v.x + 7, v.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(v.x, v.y - 1);
      ctx.lineTo(v.x, v.y - 14);
      ctx.stroke();

      var glow2 = 0.4 + 0.6 * Math.sin(t * 0.01 + v.phase);
      ctx.fillStyle = "rgba(255, 175, 70, " + (0.35 * glow2) + ")";
      ctx.beginPath();
      ctx.arc(v.x, v.y - 15, 4, 0, TAU);
      ctx.fill();

      ctx.restore();
      break;
    }

    case "gatling": {
      var alphaB = clamp(v.life / 600, 0, 1);
      ctx.save();
      ctx.globalAlpha = alphaB;
      ctx.translate(v.x, v.y);
      ctx.scale(v.scale, v.scale);

      ctx.fillStyle = "#3a3e48";
      ctx.fillRect(-30, -9, 44, 18);

      ctx.fillStyle = "#5a1420";
      ctx.beginPath();
      ctx.arc(-17, 0, 10, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#2a2e38";
      for (var k2 = 0; k2 < 6; k2++) {
        var a2 = (k2 / 6) * TAU;
        ctx.fillRect(12, Math.sin(a2) * 5 - 1.5, 12, 3);
      }

      ctx.restore();
      break;
    }

    case "cakeBox": {
      var alphaC = clamp(v.life / 800, 0, 1);
      ctx.save();
      ctx.globalAlpha = alphaC;

      ctx.fillStyle = "rgba(0,0,0,0.48)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y + 2, v.boxW * 0.55, 5, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#2a3a7a";
      ctx.fillRect(v.x - v.boxW * 0.5, v.y - v.boxH, v.boxW, v.boxH);

      ctx.fillStyle = "#060810";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y - v.boxH, v.boxW * 0.5, 4, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#0a0a0a";
      var cols = 5;
      for (var cc = 0; cc < cols; cc++) {
        var px = v.x - v.boxW * 0.38 + cc * (v.boxW * 0.19);
        ctx.beginPath();
        ctx.arc(px, v.y - v.boxH + 2, 2.5, 0, TAU);
        ctx.fill();
      }

      ctx.fillStyle = "rgba(200, 170, 80, 0.6)";
      ctx.fillRect(v.x - v.boxW * 0.5, v.y - v.boxH * 0.58, v.boxW, 2);

      ctx.restore();
      break;
    }

    case "fanRack": {
      var alphaD = clamp(v.life / 900, 0, 1);
      ctx.save();
      ctx.globalAlpha = alphaD;

      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y + 2, v.boxW * 0.55, 6, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#3a2a6a";
      ctx.fillRect(v.x - v.boxW * 0.5, v.y - v.boxH * 0.55, v.boxW, v.boxH * 0.55);

      ctx.strokeStyle = "#2a2a3a";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      for (var fc = 0; fc < 11; fc++) {
        var ft = fc / 10;
        var fangle = lerp(-1.15, 1.15, ft);
        var fc2 = v.x + Math.sin(fangle) * 5;
        var fcy = v.y - v.boxH * 0.55;
        var fex = fc2 + Math.sin(fangle) * 34;
        var fey = fcy - Math.cos(fangle) * 34;
        ctx.beginPath();
        ctx.moveTo(fc2, fcy);
        ctx.lineTo(fex, fey);
        ctx.stroke();
      }

      ctx.restore();
      break;
    }

    case "mortarTube": {
      var alphaE = clamp(v.life / 1000, 0, 1);
      ctx.save();
      ctx.globalAlpha = alphaE;

      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y + 2, v.tubeW * 1.0, 4.5, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#3a4250";
      ctx.fillRect(v.x - v.tubeW * 0.5, v.y - v.tubeH, v.tubeW, v.tubeH);

      ctx.fillStyle = "#1a1e26";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y, v.tubeW * 0.7, v.tubeW * 0.26, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#050810";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y - v.tubeH, v.tubeW * 0.34, v.tubeW * 0.14, 0, 0, TAU);
      ctx.fill();

      var glow3 = 0.4 + 0.6 * Math.sin(t * 0.004 + v.phase);
      ctx.fillStyle = "rgba(255, 180, 60, " + (0.4 * glow3) + ")";
      ctx.beginPath();
      ctx.arc(v.x, v.y - v.tubeH, 6, 0, TAU);
      ctx.fill();

      ctx.restore();
      break;
    }

    case "commercialRack": {
      var alphaF = clamp(v.life / 1200, 0, 1);
      ctx.save();
      ctx.globalAlpha = alphaF;

      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.beginPath();
      ctx.ellipse(v.x, v.y + 2, v.boxW * 0.6, 6, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#2a2e42";
      ctx.fillRect(v.x - v.boxW * 0.5, v.y - v.boxH * 0.42, v.boxW, v.boxH * 0.42);

      ctx.fillStyle = "#1e2230";
      for (var rr = 0; rr < 3; rr++) {
        for (var c2 = 0; c2 < 4; c2++) {
          var px2 = v.x - v.boxW * 0.36 + c2 * (v.boxW * 0.24);
          var py2 = v.y - v.boxH * 0.42 - rr * 12;
          ctx.fillRect(px2 - 5, py2 - 18, 10, 18);
        }
      }

      ctx.fillStyle = "rgba(200, 170, 80, 0.55)";
      ctx.fillRect(v.x - v.boxW * 0.5, v.y - v.boxH * 0.42, v.boxW, 2);

      ctx.restore();
      break;
    }

    case "rocket":
    case "slimRocket":
    case "shellRocket": {
      ctx.save();
      ctx.translate(v.x, v.y);
      ctx.rotate(v.angle);

      var s = v.scale;
      var isShell = v.type === "shellRocket";
      var isSlim = v.type === "slimRocket";
      var wR = isShell ? 8 * s : (isSlim ? 4.5 * s : 6 * s);
      var hR = isShell ? 38 * s : (isSlim ? 30 * s : 34 * s);

      /* 稳定杆 */
      ctx.strokeStyle = "#3a2a1c";
      ctx.lineWidth = isShell ? 2 * s : 1.5 * s;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 5 * s);
      ctx.lineTo(0, hR * 0.8);
      ctx.stroke();

      /* 主体 */
      var bc = v.bodyColor || "#c8232c";
      ctx.fillStyle = nightShade(bc, 0.75);
      ctx.fillRect(-wR * 0.5, -hR * 0.55, wR, hR * 0.65);

      /* 金环 */
      ctx.fillStyle = "rgba(200, 160, 60, 0.85)";
      ctx.fillRect(-wR * 0.5, -hR * 0.42, wR, 1.5 * s);
      ctx.fillRect(-wR * 0.5, -hR * 0.12, wR, 1.5 * s);

      /* 头部 */
      ctx.fillStyle = "#c8a038";
      ctx.beginPath();
      ctx.moveTo(-wR * 0.5, -hR * 0.55);
      ctx.lineTo(0, -hR * 0.85);
      ctx.lineTo(wR * 0.5, -hR * 0.55);
      ctx.closePath();
      ctx.fill();

      /* 尾焰 */
      var flameLen = hR * 0.35 + Math.random() * hR * 0.2;
      var fg = ctx.createLinearGradient(0, hR * 0.1, 0, hR * 0.1 + flameLen);
      fg.addColorStop(0, "rgba(255, 245, 200, 0.9)");
      fg.addColorStop(0.4, "rgba(255, 190, 70, 0.75)");
      fg.addColorStop(1, "rgba(255, 100, 30, 0)");
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(-wR * 0.4, hR * 0.1);
      ctx.lineTo(0, hR * 0.1 + flameLen);
      ctx.lineTo(wR * 0.4, hR * 0.1);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
      break;
    }

    default:
      break;
  }
}

function drawVehicles() {
  for (var i = 0; i < state.vehicles.length; i++) {
    drawVehicle(state.vehicles[i]);
  }
}

/* ============================================================
   场景构建
   ============================================================ */
function buildCity() {
  var rnd = mulberry32(1337);
  var groundY = H * 0.86;

  var stars = [];
  var starCount = Math.round((W * H) / 5200);
  for (var i = 0; i < starCount; i++) {
    stars.push({
      x: rnd() * W,
      y: rnd() * H * 0.68,
      r: rnd() * 1.35 + 0.3,
      a: 0.22 + rnd() * 0.78,
      ph: rnd() * TAU
    });
  }

  var buildings = [];
  var bx = -30;
  while (bx < W + 30) {
    var bw = 44 + rnd() * 95;
    var bh = H * 0.16 + rnd() * H * 0.52;
    var by = groundY - bh;

    var win = [];
    var cw = 8, ch = 12, gx = 7, gy = 10;
    var cols = Math.max(1, Math.floor((bw - 12) / (cw + gx)));
    var rows = Math.max(1, Math.floor((bh - 18) / (ch + gy)));
    var ox = bx + (bw - (cols * (cw + gx) - gx)) / 2;
    var oy = by + 14;

    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if (rnd() < 0.45) {
          var roll = rnd();
          win.push({
            x: ox + c * (cw + gx),
            y: oy + r * (ch + gy),
            w: cw, h: ch,
            c: roll < 0.62 ? "#ffd27a" : (roll < 0.85 ? "#ffb35c" : "#9fd8ff"),
            a: 0.35 + rnd() * 0.65
          });
        }
      }
    }

    buildings.push({ x: bx, y: by, w: bw, h: bh, win: win });
    bx += bw + 3 + rnd() * 16;
  }

  var lamps = [];
  var lampCount = Math.max(3, Math.round(W / 250));
  for (var li = 0; li < lampCount; li++) {
    lamps.push({
      x: W * (li + 0.5) / lampCount + (rnd() - 0.5) * 40,
      y: groundY
    });
  }

  var roadTop = groundY + 4;
  var roadHeight = H - roadTop;
  var laneCount = roadHeight > 70 ? 3 : 2;
  var laneGap = Math.min(28, roadHeight / (laneCount + 0.4));
  var laneY = [];
  for (var lj = 0; lj < laneCount; lj++) {
    laneY.push(roadTop + laneGap * 0.65 + lj * laneGap);
  }

  var carColors = [
    "#2a4a7a", "#7a2a3a", "#2a6a4a", "#6a5a2a",
    "#4a2a6a", "#3a3a4a", "#7a4a2a", "#2a5a6a"
  ];

  var cars = [];
  for (var lane = 0; lane < laneCount; lane++) {
    var dir = lane % 2 === 0 ? 1 : -1;
    var laneSpeed = 52 + rnd() * 22;
    var spacingMin = 200;
    var spacingMax = 340;

    if (dir > 0) {
      var cx2 = -300 - rnd() * 100;
      while (cx2 < W + 300) {
        cars.push({
          x: cx2, y: laneY[lane], dir: 1, speed: laneSpeed,
          color: carColors[Math.floor(rnd() * carColors.length)],
          len: 32 + rnd() * 16,
          h: 14 + rnd() * 3.5
        });
        cx2 += spacingMin + rnd() * (spacingMax - spacingMin);
      }
    } else {
      var cx3 = W + 300 + rnd() * 100;
      while (cx3 > -300) {
        cars.push({
          x: cx3, y: laneY[lane], dir: -1, speed: laneSpeed,
          color: carColors[Math.floor(rnd() * carColors.length)],
          len: 32 + rnd() * 16,
          h: 14 + rnd() * 3.5
        });
        cx3 -= spacingMin + rnd() * (spacingMax - spacingMin);
      }
    }
  }

  return {
    groundY: groundY,
    stars: stars,
    buildings: buildings,
    lamps: lamps,
    moon: { x: W * 0.14, y: H * 0.15, r: Math.min(46, W * 0.045) },
    laneY: laneY,
    cars: cars
  };
}

function buildHarbor() {
  var rnd = mulberry32(777);
  var horizon = H * 0.62;

  var stars = [];
  var starCount = Math.round((W * H) / 4600);
  for (var i = 0; i < starCount; i++) {
    stars.push({
      x: rnd() * W,
      y: rnd() * horizon * 0.94,
      r: rnd() * 1.25 + 0.3,
      a: 0.22 + rnd() * 0.72,
      ph: rnd() * TAU
    });
  }

  var skyline = [];
  var sx = -20;
  while (sx < W + 20) {
    var sw = 18 + rnd() * 46;
    var sh = 18 + rnd() * 72;
    skyline.push({ x: sx, w: sw, h: sh });
    sx += sw + rnd() * 9;
  }

  var moon = { x: W * 0.74, y: H * 0.17, r: Math.min(40, W * 0.038) };

  var glints = [];
  for (var g = 0; g < 70; g++) {
    var gy = horizon + 5 + g * g * 0.42 + rnd() * 6;
    if (gy > H) break;
    glints.push({
      y: gy,
      w: 14 + rnd() * 66,
      off: (rnd() - 0.5) * 190,
      ph: rnd() * TAU,
      sp: 0.5 + rnd() * 1.6
    });
  }

  var boats = [];
  for (var b = 0; b < 3; b++) {
    boats.push({
      x: W * (0.22 + rnd() * 0.6),
      y: horizon + 20 + rnd() * 46,
      s: 0.6 + rnd() * 0.6,
      ph: rnd() * TAU
    });
  }

  return {
    horizon: horizon,
    stars: stars,
    skyline: skyline,
    moon: moon,
    glints: glints,
    boats: boats,
    lighthouse: {
      x: W * 0.09,
      top: horizon - Math.min(118, H * 0.18),
      base: horizon + 26
    }
  };
}

function buildVillage() {
  var rnd = mulberry32(4242);

  var stars = [];
  var starCount = Math.round((W * H) / 4200);
  for (var i = 0; i < starCount; i++) {
    stars.push({
      x: rnd() * W,
      y: rnd() * H * 0.64,
      r: rnd() * 1.4 + 0.3,
      a: 0.22 + rnd() * 0.78,
      ph: rnd() * TAU,
      twSpeed: 0.0012 + rnd() * 0.0024
    });
  }

  var galaxy = [];
  for (var g = 0; g < 16; g++) {
    galaxy.push({
      x: W * 0.12 + g * (W * 0.058),
      y: H * 0.07 + g * (H * 0.023),
      r: W * 0.11 + rnd() * 70,
      c: rnd() < 0.5 ? "150,175,255" : "198,160,255"
    });
  }

  var ranges = [];
  var baseY = H * 0.86;
  var layerColors = ["#0d1533", "#0a1128", "#05080f"];
  for (var L = 0; L < 3; L++) {
    var pts = [];
    var n = 10 + L * 4;
    var yb = baseY - (2 - L) * H * 0.02;
    var peak = H * (0.20 + L * 0.075);
    for (var k = 0; k <= n; k++) {
      var px = -40 + (W + 80) * k / n;
      var py = yb - peak * (0.22 + 0.78 * rnd());
      pts.push({ x: px, y: py });
    }
    pts.unshift({ x: -40, y: H + 20 });
    pts.push({ x: W + 40, y: H + 20 });
    ranges.push({ pts: pts, color: layerColors[L] });
  }

  var trees = [];
  for (var tr = 0; tr < 9; tr++) {
    trees.push({
      x: rnd() * W,
      y: H * 0.90 + rnd() * H * 0.08,
      s: 0.6 + rnd() * 0.9
    });
  }

  var houses = [];
  for (var h = 0; h < 5; h++) {
    houses.push({
      x: W * (0.06 + rnd() * 0.84),
      y: H * 0.93 + rnd() * H * 0.04,
      w: 46 + rnd() * 34,
      ht: 40 + rnd() * 26,
      ph: rnd() * TAU
    });
  }

  var fireflies = [];
  var fireflyCount = Math.max(14, Math.round(W / 70));
  for (var f = 0; f < fireflyCount; f++) {
    var baseX = rnd() * W;
    var baseY2 = H * 0.72 + rnd() * H * 0.24;
    fireflies.push({
      baseX: baseX,
      baseY: baseY2,
      x: baseX,
      y: baseY2,
      phase: rnd() * TAU,
      speed: 0.4 + rnd() * 0.8,
      ampX: 20 + rnd() * 50,
      ampY: 12 + rnd() * 30,
      color: rnd() < 0.55 ? "#aaffaa" : "#ffffaa",
      size: 0.7 + rnd() * 0.8,
      blinkPhase: rnd() * TAU,
      blinkSpeed: 1.2 + rnd() * 1.8,
      wanderTimer: rnd() * 3000
    });
  }

  var meteors = [];
  var meteorTimer = 1500 + rnd() * 4000;

  var mists = [];
  for (var m = 0; m < 3; m++) {
    mists.push({
      x: rnd() * W,
      y: H * (0.68 + m * 0.06),
      w: W * (0.4 + rnd() * 0.4),
      h: 20 + rnd() * 20,
      speed: 6 + rnd() * 14,
      alpha: 0.06 + rnd() * 0.06,
      dir: rnd() < 0.5 ? 1 : -1
    });
  }

  return {
    stars: stars,
    galaxy: galaxy,
    ranges: ranges,
    trees: trees,
    houses: houses,
    fireflies: fireflies,
    meteors: meteors,
    meteorTimer: meteorTimer,
    mists: mists
  };
}

function buildScenes() {
  sceneCache.city = buildCity();
  sceneCache.harbor = buildHarbor();
  sceneCache.village = buildVillage();
}

/* ============================================================
   场景绘制
   ============================================================ */
function drawMoon(x, y, r) {
  var halo = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 6);
  halo.addColorStop(0, "rgba(255,250,220,0.30)");
  halo.addColorStop(0.28, "rgba(200,215,255,0.10)");
  halo.addColorStop(1, "rgba(160,190,255,0)");
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(x, y, r * 6, 0, TAU);
  ctx.fill();

  ctx.fillStyle = "#fdf6d8";
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();

  ctx.fillStyle = "rgba(212,202,160,0.40)";
  ctx.beginPath();
  ctx.arc(x - r * 0.30, y - r * 0.18, r * 0.17, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + r * 0.24, y + r * 0.30, r * 0.12, 0, TAU);
  ctx.fill();
}

function drawStars(stars, t, speed, color) {
  var baseColor = color || "#d8e6ff";
  ctx.fillStyle = baseColor;
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var sp = s.twSpeed || speed;
    var tw = 0.55 + 0.45 * Math.sin(t * sp + s.ph);
    ctx.globalAlpha = s.a * tw;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawLamp(x, baseY) {
  var topY = baseY - 92;
  var armX = x + 16;

  ctx.strokeStyle = "#131a30";
  ctx.lineWidth = 3.5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x, baseY);
  ctx.lineTo(x, topY);
  ctx.quadraticCurveTo(x, topY - 6, armX, topY - 6);
  ctx.stroke();

  var hx = armX;
  var hy = topY - 6;

  var g = ctx.createRadialGradient(hx, hy, 1, hx, hy, 82);
  g.addColorStop(0, "rgba(255,228,164,0.72)");
  g.addColorStop(0.18, "rgba(255,190,110,0.24)");
  g.addColorStop(1, "rgba(255,180,90,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(hx, hy, 82, 0, TAU);
  ctx.fill();

  ctx.fillStyle = "#fff2c8";
  ctx.beginPath();
  ctx.arc(hx, hy + 2, 4.5, 0, TAU);
  ctx.fill();
}

function drawCar(car) {
  var x = car.x;
  var y = car.y;
  var len = car.len;
  var h = car.h;
  var dir = car.dir;

  ctx.save();
  ctx.translate(x, y);
  if (dir < 0) ctx.scale(-1, 1);

  ctx.fillStyle = "rgba(0, 0, 0, 0.48)";
  ctx.beginPath();
  ctx.ellipse(0, h / 2 + 1.8, len * 0.52, 2.6, 0, 0, TAU);
  ctx.fill();

  var bodyGrad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  bodyGrad.addColorStop(0, nightShade(car.color, 0.78));
  bodyGrad.addColorStop(0.5, nightShade(car.color, 0.55));
  bodyGrad.addColorStop(1, nightShade(car.color, 0.3));

  ctx.fillStyle = bodyGrad;
  ctx.fillRect(-len / 2, -h / 2, len, h);

  ctx.fillStyle = "rgba(10, 14, 26, 0.78)";
  ctx.fillRect(-len * 0.22, -h / 2 - 1.8, len * 0.46, h * 0.66);

  ctx.fillStyle = "rgba(120, 160, 220, 0.32)";
  ctx.fillRect(-len * 0.18, -h / 2 - 0.6, len * 0.36, h * 0.46);

  var headX = len / 2 - 1.6;
  var lightY = h * 0.24;

  ctx.fillStyle = "rgba(255, 245, 200, 0.98)";
  ctx.beginPath();
  ctx.arc(headX, -lightY, 1.4, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(headX, lightY, 1.4, 0, TAU);
  ctx.fill();

  var tailX = -len / 2 + 1.4;
  ctx.fillStyle = "rgba(255, 70, 70, 0.95)";
  ctx.beginPath();
  ctx.arc(tailX, -lightY, 1.1, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(tailX, lightY, 1.1, 0, TAU);
  ctx.fill();

  ctx.fillStyle = "#0a0c12";
  ctx.beginPath();
  ctx.arc(-len * 0.28, h / 2 + 0.8, 2.5, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(len * 0.28, h / 2 + 0.8, 2.5, 0, TAU);
  ctx.fill();

  ctx.restore();
}

function drawCity(t) {
  var d = sceneCache.city;
  if (!d) return;

  var sky = ctx.createLinearGradient(0, 0, 0, d.groundY);
  sky.addColorStop(0, "#03060f");
  sky.addColorStop(0.45, "#0a1230");
  sky.addColorStop(1, "#1b2450");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, d.groundY + 2);

  drawStars(d.stars, t, 0.0016);
  drawMoon(d.moon.x, d.moon.y, d.moon.r);

  for (var i = 0; i < d.buildings.length; i++) {
    var b = d.buildings[i];
    ctx.fillStyle = "#070b18";
    ctx.fillRect(b.x, b.y, b.w, b.h);

    ctx.fillStyle = "rgba(96,132,220,0.16)";
    ctx.fillRect(b.x, b.y, b.w, 1.5);

    for (var k = 0; k < b.win.length; k++) {
      var w = b.win[k];
      ctx.globalAlpha = w.a;
      ctx.fillStyle = w.c;
      ctx.fillRect(w.x, w.y, w.w, w.h);
    }
    ctx.globalAlpha = 1;
  }

  var gg = ctx.createLinearGradient(0, d.groundY, 0, H);
  gg.addColorStop(0, "#0a0e1e");
  gg.addColorStop(0.4, "#070a16");
  gg.addColorStop(1, "#03040a");
  ctx.fillStyle = gg;
  ctx.fillRect(0, d.groundY, W, H - d.groundY);

  if (d.laneY && d.laneY.length > 1) {
    ctx.strokeStyle = "rgba(180, 200, 255, 0.1)";
    ctx.lineWidth = 1;
    ctx.setLineDash([16, 14]);
    for (var li = 0; li < d.laneY.length - 1; li++) {
      var yy = (d.laneY[li] + d.laneY[li + 1]) / 2 + 5;
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.lineTo(W, yy);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  for (var la = 0; la < d.lamps.length; la++) {
    var l = d.lamps[la];
    var g2 = ctx.createRadialGradient(l.x, d.groundY + 8, 2, l.x, d.groundY + 8, 120);
    g2.addColorStop(0, "rgba(255,190,110,0.14)");
    g2.addColorStop(1, "rgba(255,190,110,0)");
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.ellipse(l.x, d.groundY + 8, 120, 24, 0, 0, TAU);
    ctx.fill();
  }

  for (var c = 0; c < d.cars.length; c++) {
    drawCar(d.cars[c]);
  }

  for (var lm = 0; lm < d.lamps.length; lm++) {
    drawLamp(d.lamps[lm].x, d.lamps[lm].y);
  }
}

function drawLighthouse(lh, t) {
  var x = lh.x;
  var top = lh.top;
  var base = lh.base;
  var h = base - top;

  ctx.fillStyle = "#0a0f1f";
  ctx.beginPath();
  ctx.moveTo(x - 14, base);
  ctx.lineTo(x - 8, top);
  ctx.lineTo(x + 8, top);
  ctx.lineTo(x + 14, base);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#111a33";
  ctx.fillRect(x - 9, top - 14, 18, 14);

  var ang = Math.sin(t * 0.0007) * 0.55 - 0.22;
  ctx.save();
  ctx.translate(x, top - 7);
  ctx.rotate(ang);

  var beamLen = Math.min(W * 0.9, 520);
  var g = ctx.createLinearGradient(0, 0, beamLen, 0);
  g.addColorStop(0, "rgba(255,240,170,0.30)");
  g.addColorStop(0.45, "rgba(255,240,170,0.08)");
  g.addColorStop(1, "rgba(255,240,170,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(beamLen, -95);
  ctx.lineTo(beamLen, 95);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = "#fff6c8";
  ctx.beginPath();
  ctx.arc(x, top - 7, 5, 0, TAU);
  ctx.fill();
}

function drawHarbor(t) {
  var d = sceneCache.harbor;
  if (!d) return;

  var sky = ctx.createLinearGradient(0, 0, 0, d.horizon);
  sky.addColorStop(0, "#02040e");
  sky.addColorStop(0.5, "#0a1330");
  sky.addColorStop(1, "#22335f");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, d.horizon + 1);

  drawStars(d.stars, t, 0.0018);
  drawMoon(d.moon.x, d.moon.y, d.moon.r);

  ctx.fillStyle = "#070c1c";
  for (var i = 0; i < d.skyline.length; i++) {
    var b = d.skyline[i];
    ctx.fillRect(b.x, d.horizon - b.h, b.w, b.h);
  }

  var wg = ctx.createLinearGradient(0, d.horizon, 0, H);
  wg.addColorStop(0, "#0e1c3c");
  wg.addColorStop(0.4, "#081027");
  wg.addColorStop(1, "#02040c");
  ctx.fillStyle = wg;
  ctx.fillRect(0, d.horizon, W, H - d.horizon);

  for (var g = 0; g < d.glints.length; g++) {
    var gl = d.glints[g];
    var a = 0.16 + 0.22 * Math.sin(t * 0.004 * gl.sp + gl.ph);
    if (a <= 0.012) continue;

    var gx = d.moon.x + gl.off;
    var grad = ctx.createLinearGradient(gx - gl.w / 2, 0, gx + gl.w / 2, 0);
    grad.addColorStop(0, "rgba(255,248,210,0)");
    grad.addColorStop(0.5, "rgba(255,248,210," + a.toFixed(3) + ")");
    grad.addColorStop(1, "rgba(255,248,210,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(gx - gl.w / 2, gl.y, gl.w, 1.8);
  }

  ctx.strokeStyle = "rgba(90,140,220,0.085)";
  ctx.lineWidth = 1;
  for (var bi = 0; bi < 9; bi++) {
    var y = d.horizon + 16 + bi * ((H - d.horizon) / 9);
    ctx.beginPath();
    for (var x = 0; x <= W; x += 22) {
      var yy = y + Math.sin(x * 0.02 + t * 0.0015 + bi * 1.4) * 2.2;
      if (x === 0) ctx.moveTo(x, yy);
      else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }

  drawLighthouse(d.lighthouse, t);

  for (var bt = 0; bt < d.boats.length; bt++) {
    var b2 = d.boats[bt];
    var bob = Math.sin(t * 0.0016 + b2.ph) * 2;

    ctx.fillStyle = "#04060e";
    ctx.beginPath();
    ctx.moveTo(b2.x - 18 * b2.s, b2.y + bob);
    ctx.lineTo(b2.x + 18 * b2.s, b2.y + bob);
    ctx.lineTo(b2.x + 12 * b2.s, b2.y + 9 * b2.s + bob);
    ctx.lineTo(b2.x - 12 * b2.s, b2.y + 9 * b2.s + bob);
    ctx.closePath();
    ctx.fill();
  }
}

function drawPine(x, y, s) {
  ctx.fillStyle = "#03060e";
  ctx.beginPath();
  for (var i = 0; i < 4; i++) {
    var yy = y - i * 17 * s;
    var w = (34 - i * 7) * s;
    ctx.moveTo(x - w, yy);
    ctx.lineTo(x, yy - 27 * s);
    ctx.lineTo(x + w, yy);
    ctx.closePath();
  }
  ctx.fill();
}

function drawHouse(h, t) {
  var x = h.x;
  var y = h.y;
  var w = h.w;
  var ht = h.ht;

  ctx.fillStyle = "#080b16";
  ctx.fillRect(x, y - ht, w, ht);

  ctx.beginPath();
  ctx.moveTo(x - 6, y - ht);
  ctx.lineTo(x + w / 2, y - ht - 18);
  ctx.lineTo(x + w + 6, y - ht);
  ctx.closePath();
  ctx.fill();

  var flick = 0.82 + 0.18 * Math.sin(t * 0.003 + h.ph);
  ctx.globalAlpha = flick;
  ctx.fillStyle = "#ffbe5c";
  ctx.fillRect(x + w * 0.18, y - ht * 0.72, w * 0.22, ht * 0.30);
  ctx.fillRect(x + w * 0.60, y - ht * 0.72, w * 0.22, ht * 0.30);
  ctx.globalAlpha = 1;
}

function drawVillage(t) {
  var d = sceneCache.village;
  if (!d) return;

  var sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#04061a");
  sky.addColorStop(0.40, "#0a0f30");
  sky.addColorStop(0.72, "#151a44");
  sky.addColorStop(1, "#1c2150");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  for (var i = 0; i < d.galaxy.length; i++) {
    var b = d.galaxy[i];
    var g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, "rgba(" + b.c + ",0.055)");
    g.addColorStop(1, "rgba(" + b.c + ",0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
  }

  drawStars(d.stars, t, 0.002, "#e6f0ff");

  ctx.globalCompositeOperation = "lighter";
  for (var mi = 0; mi < d.meteors.length; mi++) {
    var m = d.meteors[mi];
    var progress = m.life / m.maxLife;
    var alpha = Math.sin(progress * Math.PI);
    var tailX = m.x - m.vx * (m.len / 10);
    var tailY = m.y - m.vy * (m.len / 10);

    var grad = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
    grad.addColorStop(0, "rgba(255, 255, 255, 0)");
    grad.addColorStop(1, "rgba(255, 255, 255, " + alpha.toFixed(3) + ")");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(m.x, m.y);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";

  for (var ri = 0; ri < d.ranges.length; ri++) {
    var r = d.ranges[ri];
    ctx.fillStyle = r.color;
    ctx.beginPath();
    ctx.moveTo(r.pts[0].x, r.pts[0].y);
    for (var k = 1; k < r.pts.length; k++) {
      ctx.lineTo(r.pts[k].x, r.pts[k].y);
    }
    ctx.closePath();
    ctx.fill();
  }

  var gg = ctx.createLinearGradient(0, H * 0.86, 0, H);
  gg.addColorStop(0, "#070b18");
  gg.addColorStop(1, "#020307");
  ctx.fillStyle = gg;
  ctx.fillRect(0, H * 0.86, W, H * 0.14);

  for (var ti = 0; ti < d.trees.length; ti++) {
    drawPine(d.trees[ti].x, d.trees[ti].y, d.trees[ti].s);
  }

  for (var hi = 0; hi < d.houses.length; hi++) {
    drawHouse(d.houses[hi], t);
  }

  ctx.globalCompositeOperation = "lighter";
  for (var fi = 0; fi < d.fireflies.length; fi++) {
    var f = d.fireflies[fi];
    var blink = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 0.001 * f.blinkSpeed + f.blinkPhase));
    if (blink < 0.12) continue;

    ctx.globalAlpha = blink * 0.9;
    var glowR = 9 * f.size;
    var g2 = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, glowR);
    g2.addColorStop(0, "rgba(255, 255, 220, " + (blink * 0.9) + ")");
    g2.addColorStop(1, hexToRgba(f.color, 0));
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(f.x, f.y, glowR, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

/* ============================================================
   更新
   ============================================================ */
function updateTimers(dt) {
  var timers = state.timers;
  for (var i = timers.length - 1; i >= 0; i--) {
    var tm = timers[i];
    tm.t -= dt;
    if (tm.t <= 0) {
      timers.splice(i, 1);
      tm.fn();
    }
  }
}

function updateCars(dt) {
  var city = sceneCache.city;
  if (!city || !city.cars) return;

  var cars = city.cars;
  var dtSec = dt / 1000;

  for (var i = 0; i < cars.length; i++) {
    var car = cars[i];
    car.x += car.dir * car.speed * dtSec;

    if (car.dir > 0 && car.x > W + 260) {
      car.x = -260 - rand(0, 180);
      car.speed = 52 + Math.random() * 22;
      car.color = ["#2a4a7a", "#7a2a3a", "#2a6a4a", "#6a5a2a",
                    "#4a2a6a", "#3a3a4a", "#7a4a2a", "#2a5a6a"][Math.floor(Math.random() * 8)];
    }
    if (car.dir < 0 && car.x < -260) {
      car.x = W + 260 + rand(0, 180);
      car.speed = 52 + Math.random() * 22;
      car.color = ["#2a4a7a", "#7a2a3a", "#2a6a4a", "#6a5a2a",
                    "#4a2a6a", "#3a3a4a", "#7a4a2a", "#2a5a6a"][Math.floor(Math.random() * 8)];
    }
  }
}

function updateVillage(dt) {
  var d = sceneCache.village;
  if (!d) return;

  var dtSec = dt / 1000;

  if (d.fireflies) {
    for (var i = 0; i < d.fireflies.length; i++) {
      var f = d.fireflies[i];

      f.x = f.baseX + Math.sin(state.time * 0.001 * f.speed + f.phase) * f.ampX;
      f.y = f.baseY + Math.cos(state.time * 0.0013 * f.speed + f.phase * 1.3) * f.ampY;

      f.wanderTimer -= dt;
      if (f.wanderTimer <= 0) {
        f.wanderTimer = 2500 + Math.random() * 5000;
        f.baseX += rand(-60, 60);
        f.baseY += rand(-30, 30);
        f.baseX = clamp(f.baseX, 0, W);
        f.baseY = clamp(f.baseY, H * 0.68, H * 0.98);
      }
    }
  }

  if (!d.meteors) d.meteors = [];
  d.meteorTimer = (d.meteorTimer || 0) - dt;
  if (d.meteorTimer <= 0) {
    d.meteorTimer = 2800 + Math.random() * 5000;

    d.meteors.push({
      x: W * (0.55 + Math.random() * 0.4),
      y: H * (0.02 + Math.random() * 0.18),
      vx: -rand(4.5, 8.5),
      vy: rand(1.8, 4.2),
      life: 0,
      maxLife: 60 + rand(20, 35),
      len: 70 + rand(40, 80)
    });
  }

  for (var mi = d.meteors.length - 1; mi >= 0; mi--) {
    var m = d.meteors[mi];
    m.x += m.vx * (dt / 16.667);
    m.y += m.vy * (dt / 16.667);
    m.life += 1;
    if (m.life >= m.maxLife) d.meteors.splice(mi, 1);
  }
}

function updateRockets(dt) {
  var rockets = state.rockets;
  for (var i = rockets.length - 1; i >= 0; i--) {
    var r = rockets[i];
    r.px = r.x;
    r.py = r.y;
    r.t += dt;

    var k = clamp(r.t / r.dur, 0, 1);
    var e = easeOutQuad(k);

    r.x = lerp(r.startX, r.targetX, e);
    r.y = lerp(r.startY, r.targetY, e);

    if (r.vehicle) {
      r.vehicle.x = r.x;
      r.vehicle.y = r.y;

      var dx = r.targetX - r.startX;
      var dy = r.targetY - r.startY;
      r.vehicle.angle = Math.atan2(dy, dx) - Math.PI / 2;
    }

    for (var n = 0; n < 2; n++) {
      state.particles.push(makeParticle(
        r.x + rand(-1.5, 1.5),
        r.y + rand(-1.5, 1.5),
        rand(-0.4, 0.4),
        rand(-0.2, 0.9),
        {
          life: randInt(180, 420),
          color: pick(["#ffcf6b", "#ff9b3d", "#fff2c4"]),
          size: r.trailSize * rand(0.7, 1.2),
          drag: 0.92, grav: 0.02,
          flicker: true, glow: true
        }
      ));
    }

    if (r.t >= r.dur) {
      if (r.vehicle) {
        removeVehicle(r.vehicle);
        r.vehicle = null;
      }
      if (typeof r.onEnd === "function") r.onEnd(r);
      rockets.splice(i, 1);
    }
  }
}

function updateFormationDrone(d, dt) {
  var kf = d.formation.keyframes;

  d.px = d.x;
  d.py = d.y;
  d.t += dt;

  var t = d.t;
  var posX, posY;

  if (t <= 0) {
    posX = kf[0].x;
    posY = kf[0].y;
  } else if (t >= kf[kf.length - 1].t) {
    posX = kf[kf.length - 1].x;
    posY = kf[kf.length - 1].y;
  } else {
    posX = kf[0].x;
    posY = kf[0].y;

    for (var i = 0; i < kf.length - 1; i++) {
      var a = kf[i];
      var b = kf[i + 1];

      if (t >= a.t && t <= b.t) {
        var segDur = b.t - a.t;
        var tt = segDur > 0 ? (t - a.t) / segDur : 0;
        var e = easeInOutQuad(clamp(tt, 0, 1));
        posX = lerp(a.x, b.x, e);
        posY = lerp(a.y, b.y, e);
        break;
      }
    }
  }

  d.x = posX;
  d.y = posY;

  var descentStart = d.totalDur - d.descentDur;

  if (t < d.riseDur) {
    d.phase = "rising";
  } else if (t < descentStart) {
    d.phase = "formation";
  } else if (t < d.totalDur) {
    d.phase = "descending";
  } else {
    d.phase = "landed";
  }

  if (d.phase === "rising" || d.phase === "descending") {
    d.trailTimer += dt;
    if (d.trailTimer >= 45) {
      d.trailTimer = 0;
      state.particles.push(makeParticle(d.x, d.y, rand(-0.3, 0.3), rand(0.3, 1.0), {
        life: randInt(220, 460),
        color: d.color,
        size: rand(0.7, 1.2),
        drag: 0.93, grav: 0.01,
        flicker: true, glow: true, trail: false
      }));
    }
  }

  while (d.emitIndex < d.emitAt.length && t >= d.emitAt[d.emitIndex]) {
    if (typeof d.burstFn === "function") d.burstFn(d.x, d.y, d);
    d.emitIndex++;
  }

  if (t >= d.totalDur + 400) {
    var idx = state.drones.indexOf(d);
    if (idx >= 0) state.drones.splice(idx, 1);
  }
}

function updateDrones(dt) {
  var drones = state.drones;
  for (var i = drones.length - 1; i >= 0; i--) {
    var d = drones[i];

    if (d.formation) {
      updateFormationDrone(d, dt);
      continue;
    }

    d.px = d.x;
    d.py = d.y;
    d.t += dt;

    var descentStart = d.totalDur - d.descentDur;
    var phase;

    if (d.t < d.riseDur) phase = "rising";
    else if (d.t < descentStart) phase = "hovering";
    else if (d.t < d.totalDur) phase = "descending";
    else phase = "landed";

    d.phase = phase;

    if (phase === "rising") {
      var k = clamp(d.t / d.riseDur, 0, 1);
      var e = easeOutCubic(k);
      d.x = lerp(d.startX, d.targetX, e);
      d.y = lerp(d.startY, d.targetY, e);
    } else if (phase === "hovering") {
      var bob = Math.sin(d.t * 0.0022 + d.bobPhase) * 4;
      var swayX = Math.sin(d.t * 0.0016 + d.bobPhase * 1.7) * 2.4;
      d.x = d.targetX + swayX;
      d.y = d.targetY + bob;
    } else if (phase === "descending") {
      var k2 = clamp((d.t - descentStart) / d.descentDur, 0, 1);
      var e2 = easeInOutQuad(k2);
      d.x = lerp(d.targetX, d.endX, e2);
      d.y = lerp(d.targetY, d.endY, e2);
    } else {
      d.x = d.endX;
      d.y = d.endY;
    }

    if (phase === "rising" || phase === "descending") {
      d.trailTimer += dt;
      if (d.trailTimer >= 34) {
        d.trailTimer = 0;
        state.particles.push(makeParticle(d.x, d.y, rand(-0.3, 0.3), rand(0.3, 1.1), {
          life: randInt(220, 480),
          color: d.color,
          size: rand(0.8, 1.5),
          drag: 0.92, grav: 0.01,
          flicker: true, glow: true
        }));
      }
    }

    if (phase === "hovering") {
      d.sprayTimer += dt;
      if (d.sprayTimer >= 80) {
        d.sprayTimer = 0;
        var sprayBaseY = d.y + 8;

        for (var n = 0; n < 3; n++) {
          var ang = Math.random() * TAU;
          var sp = rand(1.4, 3.2);
          state.particles.push(makeParticle(
            d.x + Math.cos(ang) * 4,
            sprayBaseY + Math.sin(ang) * 4,
            Math.cos(ang) * sp,
            Math.sin(ang) * sp + 0.5,
            {
              life: randInt(500, 1100),
              color: pick([d.color, "#ffffff", "#ffe9a0"]),
              size: rand(1.0, 1.8),
              drag: 0.955, grav: 0.035,
              flicker: true, glow: true
            }
          ));
        }
      }
    }

    while (d.emitIndex < d.emitAt.length && d.t >= d.emitAt[d.emitIndex]) {
      if (phase === "hovering" && typeof d.burstFn === "function") {
        d.burstFn(d.x, d.y, d);
      }
      d.emitIndex++;
    }

    if (d.t >= d.totalDur + 400) {
      drones.splice(i, 1);
    }
  }
}

var MAX_PARTICLES = 4000;

function updateParticles(dt) {
  var ps = state.particles;
  var stepRatio = dt / 16.667;

  for (var i = 0; i < ps.length; i++) {
    var p = ps[i];

    p.px = p.x;
    p.py = p.y;

    var dm = Math.pow(p.drag, stepRatio);
    p.vx *= dm;
    p.vy = p.vy * dm + p.grav * stepRatio;

    p.x += p.vx * stepRatio;
    p.y += p.vy * stepRatio;

    p.life -= dt;

    if (p.splitAt !== undefined && p.life <= p.splitAt) {
      p.splitAt = undefined;
      var col = p.splitColors || PALETTES.gold;
      for (var n = 0; n < 6; n++) {
        var a = Math.random() * TAU;
        var sp = rand(1.4, 3.0);
        ps.push(makeParticle(p.x, p.y, Math.cos(a) * sp, Math.sin(a) * sp, {
          life: randInt(300, 700),
          color: pick(col),
          size: p.size * 0.8,
          drag: 0.95, grav: 0.05,
          glow: true
        }));
      }
    }

    if (p.life <= 0 || p.y > H + 80 || p.x < -140 || p.x > W + 140) {
      p.dead = true;
    }
  }

  var k = 0;
  for (var j = 0; j < ps.length; j++) {
    if (!ps[j].dead) ps[k++] = ps[j];
  }
  ps.length = k;

  if (ps.length > MAX_PARTICLES) {
    ps.splice(0, ps.length - MAX_PARTICLES);
  }
}

function updateFloats(dt) {
  var fl = state.floats;
  for (var i = fl.length - 1; i >= 0; i--) {
    var f = fl[i];
    f.y += f.vy * (dt / 16.667);
    f.vy *= 0.97;
    f.life -= dt;
    if (f.life <= 0) fl.splice(i, 1);
  }
}

var AUTO_INTERVAL = {
  sparkler: 2200, electric: 2000, flickFlower: 2200, handFountain: 2600, bee: 2600, pinwheel: 2800,
  spray: 3000, colorFountain: 3400, spinFlower: 3600, silverTree: 3800, groundCake: 3600,
  monkey: 2600, doubleBang: 2600, doubleKick: 2800, smallRocket: 2800, skyThunder: 3000, parachute: 3000,
  gatling: 5200, cake36: 6200, cake100: 7400, fanCake: 7200, cake1000: 8000,
  shell3: 3200, shell4: 3400, shell6: 3800, shell8: 4200, shell12: 4500,
  commercialShow: 9000, musicShow: 11000, dualRing: 8000, megaShow: 11000,
  droneSingle: 36000, droneFleet: 42000, droneWaterfall: 46000,
  droneLantern: 46000, droneDragon: 56000
};

function update(dt) {
  state.time += dt;

  updateTimers(dt);
  updateVehicles(dt);
  updateCars(dt);
  updateVillage(dt);
  updateRockets(dt);
  updateDrones(dt);
  updateParticles(dt);
  updateFloats(dt);

  if (state.flash > 0) {
    state.flash -= dt * 0.0028;
    if (state.flash < 0) state.flash = 0;
  }

  if (business.enabled) {
    business.historyTimer += dt;
    if (business.historyTimer >= 3000) {
      business.historyTimer = 0;

      if (business.balance !== business.lastSampleBalance ||
          business.balanceHistory.length === 0) {
        business.balanceHistory.push({
          t: state.time,
          balance: business.balance
        });
        business.lastSampleBalance = business.balance;

        if (business.balanceHistory.length > 60) {
          business.balanceHistory.shift();
        }

        renderBusinessChart();
      }
    }
  }

  if (state.auto) {
    state.autoCountdown -= dt;
    if (state.autoCountdown <= 0) {
      var base = AUTO_INTERVAL[state.selectedId] || 3000;
      state.autoCountdown = base * rand(0.65, 1.45);

      var ax = rand(W * 0.14, W * 0.86);
      var ay = rand(H * 0.08, H * 0.46);
      fireSelected(ax, ay);
    }
  }
}

/* ============================================================
   无人机绘制
   ============================================================ */
function drawDrone(d, t) {
  var pulse = 0.7 + 0.3 * Math.sin(t * 0.008 + d.bobPhase);
  var bodyAngle = d.phase === "rising" ? -0.1 : (d.phase === "descending" ? 0.1 : 0);

  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.rotate(bodyAngle);

  var s = d.size;

  var glowR = 22 * s;
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
  g.addColorStop(0, "rgba(255,255,255," + (0.42 * pulse) + ")");
  g.addColorStop(0.3, hexToRgba(d.color, 0.24 * pulse));
  g.addColorStop(1, hexToRgba(d.color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, glowR, 0, TAU);
  ctx.fill();

  ctx.strokeStyle = "rgba(24, 32, 48, 0.92)";
  ctx.lineWidth = 1.4 * s;
  var armLen = 6.4 * s;
  ctx.beginPath();
  ctx.moveTo(-armLen, -armLen * 0.7);
  ctx.lineTo(armLen, armLen * 0.7);
  ctx.moveTo(-armLen, armLen * 0.7);
  ctx.lineTo(armLen, -armLen * 0.7);
  ctx.stroke();

  var rotorPhase = t * 0.05;
  for (var i = 0; i < 4; i++) {
    var ang = (i / 4) * TAU + Math.PI / 4;
    var rx = Math.cos(ang) * armLen;
    var ry = Math.sin(ang) * armLen;

    ctx.save();
    ctx.translate(rx, ry);
    ctx.rotate(rotorPhase + i);
    ctx.fillStyle = "rgba(160, 190, 230, 0.3)";
    ctx.beginPath();
    ctx.ellipse(0, 0, 4.6 * s, 1.4 * s, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  ctx.fillStyle = "#2a3448";
  ctx.beginPath();
  ctx.arc(0, 0, 3.2 * s, 0, TAU);
  ctx.fill();

  if (d.formation) {
    var bigPulse = 0.7 + 0.3 * Math.sin(t * 0.012 + d.bobPhase * 2.3);
    var lg = ctx.createRadialGradient(0, -0.4 * s, 0, 0, -0.4 * s, 7 * s);
    lg.addColorStop(0, "rgba(255, 255, 255, " + (0.95 * bigPulse) + ")");
    lg.addColorStop(0.25, hexToRgba(d.color, 0.85 * bigPulse));
    lg.addColorStop(1, hexToRgba(d.color, 0));
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.arc(0, -0.4 * s, 7 * s, 0, TAU);
    ctx.fill();
  }

  ctx.fillStyle = d.color;
  ctx.beginPath();
  ctx.arc(0, -0.4 * s, 1.3 * s, 0, TAU);
  ctx.fill();

  var blink = Math.sin(t * 0.012 + d.bobPhase) > 0;
  ctx.fillStyle = blink ? "rgba(255,80,80,0.92)" : "rgba(80,255,120,0.92)";
  ctx.beginPath();
  ctx.arc(0, 2.6 * s, 1.0, 0, TAU);
  ctx.fill();

  ctx.restore();
}

function drawFloats() {
  var fl = state.floats;
  for (var i = 0; i < fl.length; i++) {
    var f = fl[i];
    var alpha = clamp(f.life / f.maxLife, 0, 1);
    var scale = 1 + (1 - alpha) * 0.25;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = "bold " + Math.round(22 * scale) + "px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 16;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
}

function spawnFloat(x, y, text, color) {
  state.floats.push({
    x: x, y: y,
    vy: -1.1,
    life: 2200,
    maxLife: 2200,
    text: text,
    color: color || "#ffd166"
  });
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, H);

  switch (state.sceneIndex) {
    case 0: drawCity(state.time); break;
    case 1: drawHarbor(state.time); break;
    case 2: drawVillage(state.time); break;
    default: drawCity(state.time);
  }

  drawVehicles();

  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";

  var ps = state.particles;

  for (var i = 0; i < ps.length; i++) {
    var p = ps[i];
    if (!p.trail) continue;

    var lt = p.life / p.maxLife;
    var a = lt * lt * p.alpha;
    if (p.flicker) a *= 0.45 + Math.random() * 0.55;
    if (a <= 0.012) continue;

    ctx.globalAlpha = a > 1 ? 1 : a;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.size * (0.4 + lt * 0.95);

    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  for (var j = 0; j < ps.length; j++) {
    var p2 = ps[j];
    if (!p2.glow || p2.size < 1.4) continue;

    var lt2 = p2.life / p2.maxLife;
    var a2 = lt2 * lt2 * p2.alpha;
    if (a2 <= 0.015) continue;

    ctx.globalAlpha = a2 * 0.24;
    ctx.fillStyle = p2.color;
    ctx.beginPath();
    ctx.arc(p2.x, p2.y, p2.size * (1.6 + (1 - lt2) * 1.4), 0, TAU);
    ctx.fill();
  }

  for (var k = 0; k < ps.length; k++) {
    var p3 = ps[k];
    if (!p3.glow) continue;

    var lt3 = p3.life / p3.maxLife;
    var a3 = lt3 * lt3 * p3.alpha;
    if (p3.flicker) a3 *= 0.5 + Math.random() * 0.5;
    if (a3 <= 0.012) continue;

    ctx.globalAlpha = a3 > 1 ? 1 : a3 * 0.85;
    ctx.fillStyle = p3.color;
    ctx.beginPath();
    ctx.arc(p3.x, p3.y, p3.size * (0.55 + lt3 * 0.55), 0, TAU);
    ctx.fill();
  }

  for (var m = 0; m < ps.length; m++) {
    var p4 = ps[m];
    if (!p4.glow || p4.size < 1.5) continue;

    var lt4 = p4.life / p4.maxLife;
    if (lt4 < 0.7) continue;

    var a4 = lt4 * lt4 * p4.alpha * 0.55;
    ctx.globalAlpha = a4 > 1 ? 1 : a4;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(p4.x, p4.y, p4.size * 0.45 * lt4, 0, TAU);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";

  for (var d = 0; d < state.drones.length; d++) {
    drawDrone(state.drones[d], state.time);
  }

  drawFloats();

  if (state.flash > 0.01) {
    ctx.globalAlpha = state.flash * 0.12;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

/* ============================================================
   燃放 & 记账
   ============================================================ */
function addStat(item) {
  var s = state.stats[item.id];
  if (!s) {
    s = state.stats[item.id] = {
      name: item.name,
      icon: item.icon,
      count: 0,
      cost: 0
    };
  }
  s.count++;
  s.cost += item.price;
  state.totalCost += item.price;
  updateBillUI();
}

function calcBusinessIncome(cost) {
  var r = Math.random();
  var mult;

  if (r < 0.55) mult = rand(0.4, 1.2);
  else if (r < 0.85) mult = rand(1.2, 2.0);
  else if (r < 0.97) mult = rand(2.0, 3.5);
  else mult = rand(3.5, 8.0);

  return Math.max(0, Math.round(cost * mult));
}

function checkMilestones() {
  for (var i = 0; i < MILESTONES.length; i++) {
    var m = MILESTONES[i];
    if (!business.milestones[m.amount] && business.balance >= m.amount) {
      business.milestones[m.amount] = true;
      business.balance += m.reward;
      business.totalIncome += m.reward;

      audioEngine.milestone();
      showMilestoneDialog(m);

      updateBusinessUI();
      updateMilestoneUI();
      renderBadges();
      renderBusinessChart();

      break;
    }
  }
}

function fireItem(item, x, y) {
  if (!item) return false;

  if (business.enabled) {
    if (business.bankrupt) {
      showToast("你已破产，无法继续燃放。请点击「重置经营数据」重新开始。", 2400);
      return false;
    }

    if (business.balance < item.price) {
      showToast("模拟资金不足！当前余额 " + fmtMoney(business.balance) +
                "，需要 " + fmtMoney(item.price), 2200);
      return false;
    }

    business.balance -= item.price;
    business.totalExpense += item.price;

    addStat(item);
    var fn = EFFECTS[item.id];
    if (typeof fn === "function") fn(x, y, item);

    var income = calcBusinessIncome(item.price);
    business.balance += income;
    business.totalIncome += income;
    business.fireCount++;

    var profit = income - item.price;
    if (profit > 0) {
      business.streak++;
      if (business.streak > business.bestStreak) {
        business.bestStreak = business.streak;
      }
    } else {
      business.streak = 0;
    }

    if (income >= item.price * 3) {
      spawnFloat(x, y - 30, "🔥 爆款 +" + fmtMoney(income).slice(1), "#ff8c42");
      schedule(200, function () { audioEngine.coin(); });
    } else if (profit > 0) {
      spawnFloat(x, y - 30, "+" + fmtMoney(income).slice(1), "#7cf5a0");
      schedule(200, function () { audioEngine.coin(); });
    } else if (profit === 0) {
      spawnFloat(x, y - 30, "±" + fmtMoney(income).slice(1), "#ffd166");
    } else {
      spawnFloat(x, y - 30, "+" + fmtMoney(income).slice(1), "#ff9f9f");
    }

    updateBusinessUI();
    updateMilestoneUI();

    checkMilestones();

    if (!business.bankrupt && business.balance < 2) {
      business.bankrupt = true;
      audioEngine.bankrupt();

      schedule(700, function () {
        showConfirmDialog({
          icon: "💸",
          title: "模拟破产了",
          msg: "你的模拟资金已耗尽，无法继续经营。\n\n" +
               "（放心，这只是游戏中的虚拟数字）\n\n" +
               "累计模拟收入：" + fmtMoney(business.totalIncome) + "\n" +
               "累计模拟支出：" + fmtMoney(business.totalExpense) + "\n" +
               "燃放次数：" + business.fireCount + " 次\n\n" +
               "是否重新开始经营？",
          okText: "重新开始",
          cancelText: "留在破产状态",
          okClass: "good",
          onConfirm: function (confirmed) {
            if (confirmed) {
              resetBusiness();
              showToast("经营数据已重置，模拟资金 ¥10,000", 1800, true);
            }
          }
        });
      });
    }

    return true;
  }

  addStat(item);
  var fn2 = EFFECTS[item.id];
  if (typeof fn2 === "function") fn2(x, y, item);
  return true;
}

function fireSelected(x, y) {
  var item = findItem(state.selectedId);
  if (!item) return;
  fireItem(item, x, y);
}

function clearScene() {
  state.particles.length = 0;
  state.rockets.length = 0;
  state.drones.length = 0;
  state.vehicles.length = 0;
  state.timers.length = 0;
  state.floats.length = 0;
  state.flash = 0;
}

/* ============================================================
   UI 元素
   ============================================================ */
var toastEl = document.getElementById("toastEl");
var toastTimer = null;

function showToast(msg, duration, isGood) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.toggle("good", !!isGood);
  toastEl.classList.add("show");

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    toastEl.classList.remove("show");
    toastTimer = null;
  }, duration || 2200);
}

var confirmOverlay = document.getElementById("confirmOverlay");
var confirmIcon = document.getElementById("confirmIcon");
var confirmTitle = document.getElementById("confirmTitle");
var confirmMsg = document.getElementById("confirmMsg");
var confirmOk = document.getElementById("confirmOk");
var confirmCancel = document.getElementById("confirmCancel");
var confirmCallback = null;

function showConfirmDialog(cfg) {
  confirmIcon.textContent = cfg.icon || "⚠️";
  confirmTitle.textContent = cfg.title || "提示";
  confirmMsg.textContent = cfg.msg || "";
  confirmOk.textContent = cfg.okText || "确定";
  confirmCancel.textContent = cfg.cancelText || "取消";
  confirmOk.classList.toggle("good", cfg.okClass === "good");

}

function hideConfirmDialog() {
  confirmOverlay.classList.remove("show");
  confirmCallback = null;
}

confirmOk.addEventListener("click", function () {
  var cb = confirmCallback;
  hideConfirmDialog();
  if (cb) cb(true);
});

confirmCancel.addEventListener("click", function () {
  var cb = confirmCallback;
  hideConfirmDialog();
  if (cb) cb(false);
});

confirmOverlay.addEventListener("click", function (e) {
  if (e.target === confirmOverlay) {
    var cb = confirmCallback;
    hideConfirmDialog();
    if (cb) cb(false);
  }
});

var milestoneOverlay = document.getElementById("milestoneOverlay");

function spawnMilestoneParticles(milestone) {

    (function (idx) {

        var x = rand(W * 0.2, W * 0.8);

        explode(x, y, {
          count: 100, speed: 6.5,
          colors: colors, life: 2000, size: 2.4,
          pattern: "chrysanthemum"
        });
        audioEngine.explosion({ intensity: 0.8 });
        state.flash = Math.max(state.flash, 0.7);
      });
    })(i);
  }
}

/* ============================================================
   主循环
   ============================================================ */
var lastTs = 0;

function loop(ts) {
  requestAnimationFrame(loop);

  if (!lastTs) lastTs = ts;
  var dt = ts - lastTs;
  lastTs = ts;

  if (dt > 120) dt = 120;
  if (dt < 0) dt = 0;

  if (!state.paused) {
    var steps = clamp(Math.round(dt / 16.667), 1, 4);
    var sub = dt / steps;
    for (var i = 0; i < steps; i++) {
      update(sub);
    }
  }

  render();
}

/* ============================================================
   尺寸自适应
   ============================================================ */
function resize() {
  var rect = stageEl.getBoundingClientRect();

  var newW = Math.max(240, Math.round(rect.width));
  var newH = Math.max(200, Math.round(rect.height));

  DPR = Math.min(window.devicePixelRatio || 1, 2);

  W = newW;
  H = newH;

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  buildScenes();
  renderBusinessChart();
}

var resizeRaf = null;
function scheduleResize() {
  if (resizeRaf !== null) return;
  resizeRaf = requestAnimationFrame(function () {
    resizeRaf = null;
    resize();
  });
}

window.addEventListener("resize", scheduleResize);
window.addEventListener("orientationchange", function () {
  setTimeout(scheduleResize, 180);
});

/* ============================================================
   图表绘制
   ============================================================ */
function renderBusinessChart() {
  if (!bizChartCanvas || !bizChartCtx) return;

  var rect = bizChartCanvas.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return;

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = rect.width;
  var h = rect.height;

  if (bizChartCanvas.width !== Math.round(w * dpr) ||
      bizChartCanvas.height !== Math.round(h * dpr)) {
    bizChartCanvas.width = Math.round(w * dpr);
    bizChartCanvas.height = Math.round(h * dpr);
  }

  var c = bizChartCtx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);

  c.fillStyle = "rgba(8, 18, 14, 0.6)";
  c.fillRect(0, 0, w, h);

  c.strokeStyle = "rgba(80, 120, 100, 0.12)";
  c.lineWidth = 1;
  for (var gi = 1; gi < 4; gi++) {
    var gy = h * gi / 4;
    c.beginPath();
    c.moveTo(0, gy);
    c.lineTo(w, gy);
    c.stroke();
  }

  var history = business.balanceHistory;

  if (history.length < 2) {
    c.fillStyle = "rgba(120, 160, 140, 0.55)";
    c.font = "10px -apple-system, BlinkMacSystemFont, sans-serif";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText("数据采集中…", w / 2, h / 2);
    return;
  }

  var minB = Infinity;
  var maxB = -Infinity;
  for (var hi = 0; hi < history.length; hi++) {
    if (history[hi].balance < minB) minB = history[hi].balance;
    if (history[hi].balance > maxB) maxB = history[hi].balance;
  }

  minB = Math.min(minB, 0, 10000);
  maxB = Math.max(maxB, 10000);

  var range = maxB - minB || 1;
  var padding = range * 0.12;
  minB -= padding;
  maxB += padding;
  var finalRange = maxB - minB;

  c.beginPath();
  for (var i = 0; i < history.length; i++) {
    var x = (i / (history.length - 1)) * w;
    var y = h - ((history[i].balance - minB) / finalRange) * h;
    if (i === 0) c.moveTo(x, y);
    else c.lineTo(x, y);
  }
  c.lineTo(w, h);
  c.lineTo(0, h);
  c.closePath();

  var grad = c.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "rgba(124, 245, 160, 0.32)");
  grad.addColorStop(1, "rgba(124, 245, 160, 0.02)");
  c.fillStyle = grad;
  c.fill();

  c.beginPath();
  for (var j = 0; j < history.length; j++) {
    var x2 = (j / (history.length - 1)) * w;
    var y2 = h - ((history[j].balance - minB) / finalRange) * h;
    if (j === 0) c.moveTo(x2, y2);
    else c.lineTo(x2, y2);
  }
  c.strokeStyle = "#7cf5a0";
  c.lineWidth = 2;
  c.lineJoin = "round";
  c.stroke();

  c.save();
  c.shadowColor = "rgba(124, 245, 160, 0.6)";
  c.shadowBlur = 8;
  c.stroke();
  c.restore();

  var lastX = w - 3;
  var lastY = h - ((history[history.length - 1].balance - minB) / finalRange) * h;

  c.fillStyle = "#7cf5a0";
  c.beginPath();
  c.arc(lastX, lastY, 3.5, 0, TAU);
  c.fill();

  c.fillStyle = "#ffffff";
  c.beginPath();
  c.arc(lastX, lastY, 1.6, 0, TAU);
  c.fill();

  c.font = "bold 10px -apple-system, BlinkMacSystemFont, sans-serif";
  c.textAlign = "right";
  c.textBaseline = "top";
  c.fillStyle = "rgba(124, 245, 160, 0.85)";
  c.fillText(fmtMoney(maxB - padding), w - 5, 4);

  c.textBaseline = "bottom";
  c.fillStyle = "rgba(120, 160, 140, 0.6)";
  c.fillText(fmtMoney(Math.max(0, minB + padding)), w - 5, h - 4);
}

function selectFirework(id) {
  var item = findItem(id);
  if (!item) return;

  state.selectedId = id;

  var all = catBox.querySelectorAll(".fw-item");
  for (var i = 0; i < all.length; i++) {
    all[i].classList.toggle("active", all[i].dataset.id === id);
  }

  var secs = (item.duration / 1000).toFixed(1).replace(/\.0$/, "");
  hudSel.textContent = "当前：" + item.icon + " " + item.name +
    " " + fmtMoney(item.price) + "/" + item.unit + " · 约 " + secs + " 秒";

  if (business.enabled) updateAffordState();
}

function updateAffordState() {
  var all = catBox.querySelectorAll(".fw-item");
  for (var i = 0; i < all.length; i++) {
    var id = all[i].dataset.id;
    var item = findItem(id);
    if (!item) continue;

    if (business.enabled && business.balance < item.price) {
      all[i].classList.add("cant-afford");
    } else {
      all[i].classList.remove("cant-afford");
    }
  }
}

function updateBillUI() {
  totalEl.textContent = fmtMoney(state.totalCost);

  var totalCount = 0;
  var entries = [];

  for (var key in state.stats) {
    if (!Object.prototype.hasOwnProperty.call(state.stats, key)) continue;
    var s = state.stats[key];
    totalCount += s.count;
    entries.push(s);
  }

  totalSubEl.textContent = "共燃放 " + totalCount + " 发";

  if (entries.length === 0) {
    billEl.innerHTML = '<div class="bill-empty">还没有燃放烟花</div>';
    return;
  }

  entries.sort(function (a, b) { return b.cost - a.cost; });

  var html = "";
  for (var i = 0; i < entries.length; i++) {
    var s2 = entries[i];
    html +=
      '<div class="bill-row">' +
        '<span class="bill-name">' + s2.icon + " " + s2.name +
          " <b>×" + s2.count + "</b></span>" +
        '<span class="bill-cost">' + fmtMoney(s2.cost) + "</span>" +
      "</div>";
  }
  billEl.innerHTML = html;
}

function updateBusinessUI() {
  bizBalance.textContent = fmtMoney(business.balance);
  bizBalance.classList.toggle("negative", business.balance < 0);

  bizIncome.textContent = fmtMoney(business.totalIncome);
  bizExpense.textContent = fmtMoney(business.totalExpense);

  var profit = business.totalIncome - business.totalExpense;
  bizProfit.textContent = (profit >= 0 ? "+" : "-") + fmtMoney(Math.abs(profit));
  bizProfit.classList.toggle("positive", profit > 0);
  bizProfit.classList.toggle("negative", profit < 0);

  bizCount.textContent = business.fireCount;

  hudMoney.textContent = "💰 " + fmtMoney(business.balance);
  hudMoney.classList.toggle("negative", business.balance < 0);

  updateAffordState();
}

function updateMilestoneUI() {
  var nextMilestone = null;
  var prevAmount = 0;

  for (var i = 0; i < MILESTONES.length; i++) {
    var m = MILESTONES[i];
    if (!business.milestones[m.amount]) {
      nextMilestone = m;
      prevAmount = i === 0 ? 10000 : MILESTONES[i - 1].amount;
      break;
    }
  }

  if (!nextMilestone) {
    milestoneIcon.textContent = "🌟";
    milestoneName.textContent = "全部成就达成";
    milestonePct.textContent = "100%";
    milestoneFill.style.width = "100%";
    milestoneNext.textContent = "你已达成所有里程碑，恭喜！";
    return;
  }

  var currentBalance = Math.max(prevAmount, business.balance);
  var targetAmount = nextMilestone.amount;
  var progress = clamp((currentBalance - prevAmount) / (targetAmount - prevAmount), 0, 1);

  milestoneIcon.textContent = nextMilestone.icon;
  milestoneName.textContent = nextMilestone.name;
  milestonePct.textContent = (progress * 100).toFixed(1) + "%";
  milestoneFill.style.width = (progress * 100) + "%";
  milestoneNext.textContent = "目标：" + fmtMoney(targetAmount) +
                              " · 还差 " + fmtMoney(Math.max(0, targetAmount - business.balance));
}

function renderBadges() {
  badgesList.innerHTML = "";
  for (var i = 0; i < MILESTONES.length; i++) {

}

  if (milestoneOverlay.classList.contains("show")) return;
  if (typeof guide !== "undefined" && guide && guide.active) return;

  var rect = canvas.getBoundingClientRect();
  var x = e.clientX - rect.left;
  var y = e.clientY - rect.top;
  fireSelected(x, y);
});

window.addEventListener("keydown", function (e) {
  /* 新手引导激活时优先处理键盘 */
  if (typeof guide !== "undefined" && guide && guide.active) {
    if (e.key === "Escape") {
      e.preventDefault();
      endGuide(false);
      return;
    }
    if (e.key === "ArrowRight") {
      e.preventDefault();
      guideNextBtn.click();
      return;
    }
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      guidePrevBtn.click();
      return;
    }
    if (e.code === "Space") {
      e.preventDefault();
      return;
    }
  }

  if (e.code === "Space" &&
      !confirmOverlay.classList.contains("show") &&
      !milestoneOverlay.classList.contains("show")) {
    e.preventDefault();
    pauseBtn.click();
  }

  if (e.key === "Escape" && confirmOverlay.classList.contains("show")) {
    var cb = confirmCallback;
    hideConfirmDialog();
    if (cb) cb(false);
  }

  if (e.key === "Escape" && milestoneOverlay.classList.contains("show")) {
    hideMilestoneDialog();
  }
});

      note: "💚 再强调一次：这里的每一分钱都是虚拟的。不会扣款、不会充值、不会绑定任何账号，破产了也只是重置一下数据而已。",
      target: function () { return guideEl("businessCard"); },
      place: "auto",
      pad: 6
    },
    {
      icon: "🎛️",
      title: "操作台",
      body: "暂停 / 继续、自动燃放、清空场景、结算账单都在这里。<b>自动燃放</b>会按照当前选中的烟花，随机向天空持续投放。",
      note: "清空场景只会移除画面上的烟花，<b>不会产生任何费用</b>。",
      target: function () {
        var b = guideEl("pauseBtn");
        return closestCard(b) || b;
      },
      place: "auto",
      pad: 6
    },
    {
      icon: "🧾",
      title: "本次烟花秀账单",
      body: "这里会实时统计你燃放了多少发、模拟花费是多少，方便你回看自己“烧”掉了多少模拟数字。",
      note: "账单同样只是模拟记录，刷新页面后不会影响你的任何真实资产。",
      target: function () { return guideEl("totalEl"); },
      place: "auto",
      pad: 10
    },
    {
      icon: "🔊",
      title: "音效与画质",
      body: "可以随时开关音效（第一次需要点击一下页面才能激活浏览器音频），也可以在高清与流畅画质之间切换。",
      note: "🎆 教程结束，去尽情放烟花吧！所有数字都只存在于屏幕上，你的钱包一分不少。",
      target: function () { return guideEl("soundToggleBtn"); },
      place: "auto",
      pad: 10
    }
  ];
}

function rectOf(el) {
  if (!el || typeof el.getBoundingClientRect !== "function") return null;
  var r = el.getBoundingClientRect();
  if (r.width <= 1 && r.height <= 1) return null;
  var vh = window.innerHeight || document.documentElement.clientHeight || 600;
  if (r.bottom < 0 || r.top > vh) return null;
  return r;
}

function renderGuideDots() {
  var html = "";
  for (var i = 0; i < guide.steps.length; i++) {
    html += '<span class="guide-dot' + (i === guide.index ? " active" : "") + '"></span>';
  }
  guideDots.innerHTML = html;
}

function updateGuideLayout() {
  if (!guide.active) return;

  var step = guide.steps[guide.index];
  if (!step) return;

  var vw = window.innerWidth || document.documentElement.clientWidth || 800;
  var vh = window.innerHeight || document.documentElement.clientHeight || 600;

  if (!guide.tipSize) {
    guide.tipSize = {
      w: guideTip.offsetWidth || 320,
      h: guideTip.offsetHeight || 200
    };
  }

  var tipW = guide.tipSize.w;
  var tipH = guide.tipSize.h;

  var el = null;
  if (typeof step.target === "function") {
    try { el = step.target(); } catch (err) { el = null; }
  }

  var r = rectOf(el);
  var pad = typeof step.pad === "number" ? step.pad : 8;

  var centerX = Math.round((vw - tipW) / 2);
  var centerY = Math.round((vh - tipH) / 2);

  if (!r) {
    guideSpot.style.display = "none";
    guideTip.style.left = clamp(centerX, 12, Math.max(12, vw - tipW - 12)) + "px";
    guideTip.style.top = clamp(centerY, 12, Math.max(12, vh - tipH - 12)) + "px";
    return;
  }

  var sx = r.left - pad;
  var sy = r.top - pad;
  var sw = r.width + pad * 2;
  var sh = r.height + pad * 2;

  if (sw >= vw * 0.94 && sh >= vh * 0.94) {
    guideSpot.style.display = "none";
    guideTip.style.left = clamp(centerX, 12, Math.max(12, vw - tipW - 12)) + "px";
    guideTip.style.top = clamp(centerY, 12, Math.max(12, vh - tipH - 12)) + "px";
    return;
  }

  guideSpot.style.display = "block";
  guideSpot.style.left = Math.round(sx) + "px";
  guideSpot.style.top = Math.round(sy) + "px";
  guideSpot.style.width = Math.round(sw) + "px";
  guideSpot.style.height = Math.round(sh) + "px";

  var spaceBelow = vh - (sy + sh);
  var spaceAbove = sy;
  var spaceRight = vw - (sx + sw);
  var spaceLeft = sx;

  var need = GUIDE_GAP + 10;
  var fits = [];
  if (spaceBelow >= tipH + need) fits.push({ k: "below", v: spaceBelow });
  if (spaceAbove >= tipH + need) fits.push({ k: "above", v: spaceAbove });
  if (spaceRight >= tipW + need) fits.push({ k: "right", v: spaceRight });
  if (spaceLeft >= tipW + need) fits.push({ k: "left", v: spaceLeft });

  var prefer = step.place || "auto";
  var chosen = null;
  var i;

  if (prefer !== "auto") {
    for (i = 0; i < fits.length; i++) {
      if (fits[i].k === prefer) {
        chosen = prefer;
        break;
      }
    }
  }

  if (!chosen) {
    if (fits.length > 0) {
      fits.sort(function (a, b) { return b.v - a.v; });
      chosen = fits[0].k;
    } else {
      chosen = "center";
    }
  }

  var tx;
  var ty;

  switch (chosen) {
    case "below":
      tx = sx + sw / 2 - tipW / 2;
      ty = sy + sh + GUIDE_GAP;
      break;
    case "above":
      tx = sx + sw / 2 - tipW / 2;
      ty = sy - tipH - GUIDE_GAP;
      break;
    case "right":
      tx = sx + sw + GUIDE_GAP;
      ty = sy + sh / 2 - tipH / 2;
      break;
    case "left":
      tx = sx - tipW - GUIDE_GAP;
      ty = sy + sh / 2 - tipH / 2;
      break;
    default:
      tx = (vw - tipW) / 2;
      ty = (vh - tipH) / 2;
      break;
  }

  tx = clamp(tx, 12, Math.max(12, vw - tipW - 12));
  ty = clamp(ty, 12, Math.max(12, vh - tipH - 12));

  guideTip.style.left = Math.round(tx) + "px";
  guideTip.style.top = Math.round(ty) + "px";
}

function guideLoop() {
  if (!guide.active) {
    guide.raf = null;
    return;
  }
  updateGuideLayout();
  guide.raf = requestAnimationFrame(guideLoop);
}

function renderGuideStep() {
  var step = guide.steps[guide.index];
  if (!step) return;

  guideIcon.textContent = step.icon || "💡";
  guideLabel.textContent = "新手指导 · " + (guide.index + 1) + " / " + guide.steps.length;
  guideTitle.textContent = step.title || "";

  var html = "";
  if (step.body) {
    html += '<div class="guide-text">' + step.body + "</div>";
  }
  if (step.note) {
    html += '<div class="guide-note">' + step.note + "</div>";
  }
  guideBody.innerHTML = html;

  var isFirst = guide.index === 0;
  var isLast = guide.index === guide.steps.length - 1;

  guidePrevBtn.disabled = isFirst;
  guidePrevBtn.classList.toggle("disabled", isFirst);
  guidePrevBtn.style.visibility = isFirst ? "hidden" : "visible";

  guideNextBtn.textContent = isLast ? "开始燃放 🎆" : "下一步";
  guideSkipBtn.textContent = isLast ? "关闭" : "跳过";

  renderGuideDots();

  guide.tipSize = null;
  updateGuideLayout();
}

function scrollGuideTargetIntoView() {
  var step = guide.steps[guide.index];
  if (!step || typeof step.target !== "function") return;

  var el = null;
  try { el = step.target(); } catch (err) { el = null; }
  if (!el || typeof el.scrollIntoView !== "function") return;

  var panelEl = document.getElementById("panel");
  if (panelEl && panelEl.contains(el)) {
    try {
      el.scrollIntoView({ block: "center", inline: "nearest" });
    } catch (err) {
      el.scrollIntoView();
    }
  } else {
    var rect = el.getBoundingClientRect();
    var vh = window.innerHeight || document.documentElement.clientHeight || 600;
    if (rect.top < 0 || rect.bottom > vh) {
      try {
        el.scrollIntoView({ block: "center", inline: "nearest" });
      } catch (err) {
        el.scrollIntoView();
      }
    }
  }
}

function goToGuideStep(idx) {
  if (!guide.active) return;

  if (idx < 0) idx = 0;
  if (idx >= guide.steps.length) {
    endGuide(true);
    return;
  }

  guide.index = idx;
  renderGuideStep();
  scrollGuideTargetIntoView();
  guide.tipSize = null;
  updateGuideLayout();
}

function startGuide(isAuto) {
  if (guide.active) return;

  guide.steps = getGuideSteps();
  guide.index = 0;
  guide.switchedMode = false;
  guide.tipSize = null;

  /* 经营模式相关的讲解需要经营卡片可见 */
  if (!business.enabled) {
    setMode("business", true);
    guide.switchedMode = true;
  }

  /* 面板滚回顶部，保证第一步定位准确 */
  var panelEl = document.getElementById("panel");
  if (panelEl) panelEl.scrollTop = 0;

  guide.active = true;
  guideOverlay.classList.add("show");
  guideSpot.style.display = "none";

  renderGuideStep();

  if (guide.raf === null) {
    guide.raf = requestAnimationFrame(guideLoop);
  }

  if (!isAuto) {
    /* 用户主动打开，不做额外提示 */
  }
}

function endGuide(completed) {
  if (!guide.active) return;

  guide.active = false;
  guideOverlay.classList.remove("show");
  guideSpot.style.display = "none";

  if (guide.raf !== null) {
    cancelAnimationFrame(guide.raf);
    guide.raf = null;
  }

  /* 如果是引导过程中自动切到经营模式，结束时还原 */
  if (guide.switchedMode) {
    guide.switchedMode = false;
    setMode("free", true);
  }

  try {
    localStorage.setItem(GUIDE_SEEN_KEY, "1");
  } catch (e) {
    /* 隐私模式下可能不可用，忽略即可 */
  }

  if (completed) {
    showToast("新手指导结束 · 尽情放烟花吧 🎆", 2000, true);
  }
}

guideNextBtn.addEventListener("click", function () {
  audioEngine.init();
  audioEngine.resume();

  if (!guide.active) return;

  if (guide.index >= guide.steps.length - 1) {
    endGuide(true);
  } else {
    goToGuideStep(guide.index + 1);
  }
});

guidePrevBtn.addEventListener("click", function () {
  if (!guide.active) return;
  if (guide.index <= 0) return;
  goToGuideStep(guide.index - 1);
});

guideSkipBtn.addEventListener("click", function () {
  endGuide(false);
});

guideCloseBtn.addEventListener("click", function () {
  endGuide(false);
});

/* 引导激活时，窗口尺寸变化后重新测量提示框 */
window.addEventListener("resize", function () {
  if (!guide.active) return;
  guide.tipSize = null;
});

window.addEventListener("orientationchange", function () {
  if (!guide.active) return;
  setTimeout(function () {
    guide.tipSize = null;
    updateGuideLayout();
  }, 220);
});

if (guideBtn) {
  guideBtn.addEventListener("click", function () {
    audioEngine.init();
    audioEngine.resume();
    startGuide(false);
  });
}

/* ============================================================
   启动
   ============================================================ */
function boot() {
  /* 初始化里程碑状态 */
  for (var i = 0; i < MILESTONES.length; i++) {
    business.milestones[MILESTONES[i].amount] = false;
  }

  /* 初始化尺寸 */
  resize();

  /* 构建界面 */
  buildSceneUI();
  buildCategoryUI();

  /* 选中默认烟花 */
  selectFirework(state.selectedId);

  /* 初始化 UI */
  updateBillUI();
  updateBusinessUI();
  updateMilestoneUI();
  renderBadges();

  /* 首次用户交互初始化音频 */
  var initAudioOnce = function () {
    audioEngine.init();
    audioEngine.resume();
    document.removeEventListener("pointerdown", initAudioOnce);
  };
  document.addEventListener("pointerdown", initAudioOnce, { once: true });

  /* 启动主循环 */
  requestAnimationFrame(loop);

  /* 首次访问自动弹出新手指导 */
  var guideSeen = false;
  try {
    guideSeen = localStorage.getItem(GUIDE_SEEN_KEY) === "1";
  } catch (e) {
    guideSeen = false;
  }

  if (!guideSeen) {
    setTimeout(function () {
      startGuide(true);
    }, 450);
  }
}

boot();

</script>
